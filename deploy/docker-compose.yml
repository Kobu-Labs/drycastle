# Shooter server + PostgreSQL. Run from this folder (see docs/release.md):
#   cp .env.example .env && edit .env      # set POSTGRES_PASSWORD
#   docker compose up -d --build
# The game port is UDP 27015; PostgreSQL is only reachable from the server container, never from the internet.
# The private asset pack (scripts/publish-private-pack.sh) is served encrypted over plain HTTP on TCP 27080 (PACK_PORT).
name: drycastle

# Container logs are capped per service: the server prints a status line every 2 s (#177).
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_USER: shooter
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: shooter
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shooter -d shooter"]
      interval: 5s
      timeout: 3s
      retries: 12

  server:
    build:
      context: ../out/shooter/linux-server
      dockerfile: ../../../deploy/Dockerfile
    restart: unless-stopped
    logging: *logging
    # tini as PID 1 forwards SIGTERM to the game and reaps children. The grace period lets _ExitTree write the queued
    # progression saves before Docker sends SIGKILL (its default is 10 s).
    init: true
    stop_grace_period: 30s
    depends_on:
      db:
        condition: service_healthy
    environment:
      DRYCASTLE_DB: postgres://shooter:${POSTGRES_PASSWORD}@db:5432/shooter
    # Extra server flags (match options, time of day, ...) go here; see docs/shooter-server.md. --allow-sandbox is on by choice
    # (sandbox players are not scored and write nothing to the database); --unlock-all is on by choice (closed friends group; nothing is saved to the database); leave out --debug-cmds.
    # --admin-token takes ADMIN_TOKEN from .env (comma-separated player_tokens; see docs/shooter-v2.md, "Chat and admin commands"). Keep it out of git.
    command: ["--allow-sandbox", "--unlock-all", "--admin-token", "${ADMIN_TOKEN:-}"]
    # Healthy once the map is loaded and the server is listening (/tmp/drycastle-ready, written by Shooter.cs).
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/drycastle-ready"]
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 20s
    ports:
      - "${GAME_PORT:-27015}:27015/udp"
    # The private asset pack, unencrypted, uploaded by scripts/publish-private-pack.sh (never by CI): collision of the pack's map objects and
    # the animal hit shapes. An empty folder is fine: the server then uses boxes, as a client without the pack does.
    volumes:
      - ../assets-private:/app/assets-private:ro
      - navcache:/navcache # the bots' baked navigation tiles, kept across images (see the Dockerfile)

  # Static file server for the ENCRYPTED private asset pack (../pack/assets-private-<id>.zip.enc), fetched by launchers that have the pack
  # password. Plain HTTP on purpose: the file is useless without the password, which never travels, and the launcher checks its sha256
  # against manifest.json. No directory listing.
  pack:
    image: caddy:2-alpine
    restart: unless-stopped
    logging: *logging
    command: ["caddy", "file-server", "--root", "/srv", "--listen", ":8080"]
    volumes:
      - ../pack:/srv:ro
    ports:
      - "${PACK_PORT:-27080}:8080/tcp"

volumes:
  pgdata:
  navcache:
