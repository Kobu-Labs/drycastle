# Shooter server + PostgreSQL. Run from this folder (see docs/release.md):
#   cp .env.example .env && edit .env      # set POSTGRES_PASSWORD
#   docker compose up -d --build
# The game port is UDP 27015; PostgreSQL is only reachable from the server container, never from the internet.
name: suchohrad

# Container logs are capped per service: the server prints a status line every 2 s (#177).
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_USER: shooter
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: shooter
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shooter -d shooter"]
      interval: 5s
      timeout: 3s
      retries: 12

  server:
    build:
      context: ../out/shooter/linux-server
      dockerfile: ../../../deploy/Dockerfile
    restart: unless-stopped
    logging: *logging
    # tini as PID 1 forwards SIGTERM to the game and reaps children. The grace period lets _ExitTree write the queued
    # progression saves before Docker sends SIGKILL (its default is 10 s).
    init: true
    stop_grace_period: 30s
    depends_on:
      db:
        condition: service_healthy
    environment:
      SUCHOHRAD_DB: postgres://shooter:${POSTGRES_PASSWORD}@db:5432/shooter
    # Extra server flags (match options, time of day, ...) go here; see docs/shooter-server.md. --allow-sandbox is on by choice
    # (sandbox players are not scored and write nothing to the database); leave out --unlock-all and --debug-cmds on a public server.
    command: ["--allow-sandbox"]
    # Healthy once the map is loaded and the server is listening (/tmp/suchohrad-ready, written by Shooter.cs).
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/suchohrad-ready"]
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 20s
    ports:
      - "${GAME_PORT:-27015}:27015/udp"

volumes:
  pgdata:
