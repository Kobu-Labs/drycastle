# Shooter server + PostgreSQL. Run from this folder (see docs/release.md):
#   cp .env.example .env && edit .env      # set POSTGRES_PASSWORD
#   docker compose up -d --build
# The game port is UDP 27015; PostgreSQL is only reachable from the server container, never from the internet.
name: suchohrad

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: shooter
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: shooter
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shooter -d shooter"]
      interval: 5s
      timeout: 3s
      retries: 12

  server:
    build:
      context: ../out/shooter/linux-server
      dockerfile: ../../../deploy/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SUCHOHRAD_DB: postgres://shooter:${POSTGRES_PASSWORD}@db:5432/shooter
    # Extra server flags (match options, time of day, ...) go here; see docs/shooter-server.md. Leave out --unlock-all,
    # --allow-sandbox and --debug-cmds on a public server.
    command: []
    ports:
      - "${GAME_PORT:-27015}:27015/udp"

volumes:
  pgdata:
