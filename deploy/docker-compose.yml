# Shooter server + PostgreSQL. Run from this folder (see docs/release.md):
#   cp .env.example .env && edit .env      # set POSTGRES_PASSWORD
#   docker compose up -d --build
# The game port is UDP 27015; PostgreSQL is only reachable from the server container, never from the internet.
# The private asset pack (scripts/publish-private-pack.sh) is served encrypted over plain HTTP on TCP 27080 (PACK_PORT).
name: drycastle

# Container logs are capped per service: the server prints a status line every 2 s (#177).
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_USER: shooter
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: shooter
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shooter -d shooter"]
      interval: 5s
      timeout: 3s
      retries: 12

  server:
    build:
      context: ../out/shooter/linux-server
      dockerfile: ../../../deploy/Dockerfile
    restart: unless-stopped
    logging: *logging
    # tini as PID 1 forwards SIGTERM to the game and reaps children. The grace period lets _ExitTree write the queued
    # progression saves before Docker sends SIGKILL (its default is 10 s).
    init: true
    stop_grace_period: 30s
    depends_on:
      db:
        condition: service_healthy
    environment:
      DRYCASTLE_DB: postgres://shooter:${POSTGRES_PASSWORD}@db:5432/shooter
      # where the server sends its numbers every 10 s (the metrics service below; docs/monitoring.md). The server runs the same without it.
      DRYCASTLE_METRICS_URL: http://metrics:8428/write
    # Extra server flags (match options, time of day, ...) go here; see docs/shooter-server.md. --allow-sandbox is on by choice
    # (sandbox players are not scored and write nothing to the database); --unlock-all is on by choice (closed friends group; nothing is saved to the database); leave out --debug-cmds.
    # --admin-token takes ADMIN_TOKEN from .env (comma-separated player_tokens; see docs/shooter-v2.md, "Chat and admin commands"). Keep it out of git.
    command: ["--allow-sandbox", "--unlock-all", "--admin-token", "${ADMIN_TOKEN:-}"]
    # Healthy once the map is loaded and the server is listening (/tmp/drycastle-ready, written by Shooter.cs).
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/drycastle-ready"]
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 20s
    ports:
      - "${GAME_PORT:-27015}:27015/udp"
    # The private asset pack, unencrypted, uploaded by scripts/publish-private-pack.sh (never by CI): collision of the pack's map objects and
    # the animal hit shapes. An empty folder is fine: the server then uses boxes, as a client without the pack does.
    volumes:
      - ../assets-private:/app/assets-private:ro
      - navcache:/navcache # the bots' baked navigation tiles, kept across images (see the Dockerfile)

  # Static file server for the ENCRYPTED private asset pack (../pack/assets-private-<id>.zip.enc), fetched by launchers that have the pack
  # password. Plain HTTP on purpose: the file is useless without the password, which never travels, and the launcher checks its sha256
  # against manifest.json. No directory listing.
  pack:
    image: caddy:2-alpine
    restart: unless-stopped
    logging: *logging
    command: ["caddy", "file-server", "--root", "/srv", "--listen", ":8080"]
    volumes:
      - ../pack:/srv:ro
    ports:
      - "${PACK_PORT:-27080}:8080/tcp"

  # ---- monitoring (docs/monitoring.md): about 250 MB of memory in all, each service capped, none of them needed by the game ----

  # The metrics store (VictoriaMetrics, one process). The game server pushes to it; it fetches the host's numbers from `node` itself.
  # Not reachable from outside the compose network.
  metrics:
    image: victoriametrics/victoria-metrics:v1.156.0
    restart: unless-stopped
    logging: *logging
    command:
      - -storageDataPath=/storage
      - -retentionPeriod=90d
      - -memory.allowedBytes=64MiB
      - -promscrape.config=/etc/metrics/scrape.yml
      - -loggerLevel=WARN
    mem_limit: 192m
    volumes:
      - metricsdata:/storage
      - ./monitoring/scrape.yml:/etc/metrics/scrape.yml:ro

  # The host's CPU (with the time the provider took: steal), memory, disk and load.
  node:
    image: prom/node-exporter:v1.12.1
    restart: unless-stopped
    logging: *logging
    command:
      - --path.rootfs=/host
      - --collector.disable-defaults
      - --collector.cpu
      - --collector.meminfo
      - --collector.loadavg
      - --collector.filesystem
      - --collector.diskstats
      - --collector.netdev
      - --collector.pressure
    pid: host
    mem_limit: 48m
    volumes:
      - /:/host:ro,rslave

  # The dashboards. Listens on the VPS's own loopback only: open it through an ssh tunnel (docs/monitoring.md), never from the internet.
  grafana:
    image: grafana/grafana-oss:12.4.3
    restart: unless-stopped
    logging: *logging
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/drycastle-server.json
    mem_limit: 256m
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    volumes:
      - grafanadata:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro

volumes:
  pgdata:
  navcache:
  metricsdata:
  grafanadata:
