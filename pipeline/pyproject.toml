[project]
name = "suchohrad-pipeline"
version = "0.1.0"
description = "Scripted, re-runnable generator for the Suchohrad base map"
requires-python = ">=3.13,<3.14"
dependencies = [
    "shapely",
    "pyproj",
    "numpy",
    "trimesh",
    "rasterio",
    "requests",
    "pyyaml",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/suchohrad_pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
