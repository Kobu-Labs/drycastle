[project]
name = "drycastle-pipeline"
version = "0.1.0"
description = "Scripted, re-runnable generator for the Drycastle base map"
requires-python = ">=3.13,<3.14"
dependencies = [
    "shapely",
    "pyproj",
    "numpy",
    "trimesh",
    "rasterio",
    "requests",
    "pyyaml",
    "mapbox-earcut>=2.1.0",
    "mcp>=2.3.0",
]

[dependency-groups]
dev = [
    "matplotlib>=3.11.2",
    "pytest",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/drycastle_pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
