# Copy to slice.local.yaml (gitignored) and fill in your own values.
# The slice is a square around the centroid of one OSM way (for example a building).
osm_way: 1234567890   # placeholder: OSM way id whose centroid is the slice centre
radius_m: 100         # half-side of the slice in metres (default 100)
margin_m: 25          # extra metres fetched around the slice (default 25)

# Whole-village area (AREA=village / --area village): same centre, a larger square.
# Fetched to data/village/raw, built in data/village/work, exported to out/village/map.
# The parcel registry (registry/parcels.registry.json) is shared by both areas.
village:
  radius_m: 700       # half-side in metres (default 700)
  margin_m: 25        # extra metres fetched around it (default: margin_m above)
  # Optional: any simple polygon instead of the square (radius_m is then ignored). Absolute
  # S-JTSK (EPSG:5514) metres [x, y], at least 3 points, no need to repeat the first. Only what
  # touches it is kept; margin_m is fetched around it but dropped. The centre (osm_way) stays
  # the origin of the local frame, so coordinates do not move when the outline changes.
  # polygon:
  #   - [-589500.0, -1250500.0]
  #   - [-588000.0, -1250500.0]
  #   - [-588000.0, -1249000.0]
