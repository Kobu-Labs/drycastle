# Parcel, ground and building rules for the base map.
#
# Read by the `parcels` stage (parcels, ground areas, chunking) and the `rules` stage (`buildings` section
# at the end). Changing a value and re-running the pipeline regenerates the map.

# --- Parcel registry matching ---------------------------------------------------------------
registry:
  # A registry entry whose cadastral reference vanished is matched to an unmatched current
  # parcel when the intersection-over-union of their outlines is at least this (0..1).
  min_iou: 0.5

# --- Building assignment --------------------------------------------------------------------
# Each OSM building goes to the parcel it overlaps most (straddling buildings included).
building_assignment:
  # A building overlapping no parcel goes to the nearest parcel closer than this many metres,
  # otherwise it is listed as unassigned.
  max_distance_m: 10

# --- Parcels and ground (parcels stage, ground.py) -----------------------------------------
# Only a property is a parcel: a cadastral parcel with a building (kind building_plot), or one in a property group
# (config/edits.json) with a parcel that has a building (kind garden). The land of every other cadastral parcel
# (fields, forest, water, the land roads lie on, loose gardens) becomes ground areas, cut by type below.
ground:
  # A piece of ground smaller than this (m2) is dropped (the terrain keeps the fallback colour there).
  min_area_m2: 1.0
  # Parcels cut down to their buildings: the parcel becomes the building outline(s) grown by margin_m (a slim yard), and the
  # rest of its land is ground (whatever the types below make of it). Use it for a big cadastral parcel (a field, the
  # dike) that is only a parcel because a building stands on it.
  carve:
    P-0073: {margin_m: 2.0}   # the dike strip north of the village: a hut stands on it
    P-0754: {margin_m: 2.0}   # a 13 ha field with one building
    P-0089: {margin_m: 2.0}   # the streets and squares of the village core: only a parcel because buildings stand on it
  # What no type below claims.
  default: field
  # A type is a named bundle of terrain attributes (ground_attributes.py; ADR 0015, 0022). Types are tried top to bottom; each takes what the
  # ones above left of its source (a type without a source is only the default, or for hand-made areas):
  #   rule: dike    the flood dike of detail.dike (its parcels, and the clipped part of its clips parcels)
  #   osm           OSM polygons, {class: [values]} with class landuse or natural
  # and carries the attributes it lists under `attributes`. What a type does not list it does not carry. By relation:
  #   Appearance    colours   terrain shades (one is picked per area)
  #                 recipe    detail recipe: field, forest, village, dike or crop (detail.py RECIPES); none: no patches, no clutter
  #                 detail    settings laid over that recipe's section of `detail` below, for this type only
  #   Water         water     true: a water body (water.json), no detail
  # Every point has exactly one ground type: a ground area is of one type, a hand-drawn ground patch (edits.json) too. A type
  # carries nothing a game system reads; what an area means in play (players spawn, wildlife, events) is a zone, see `zones`
  # below. A type with a source (osm, rule) needs attributes: they say what the land it takes looks like.
  types:
    dike:
      rule: dike
      attributes:
        colours: ["#86b362", "#7aa858"]
        recipe: dike
    water:
      osm: {natural: [water]}
      attributes:
        colours: ["#6b7a6a", "#62725f"]
        water: true
    forest:
      osm: {landuse: [forest], natural: [wood]}
      attributes:
        # lush green floor in several shades; the brown is the litter, mud and dirt patches (detail.forest)
        colours: ["#3b7a3a", "#2f6a36", "#4a8a3e", "#35733f"]
        recipe: forest
    # garden plots outside the properties: mostly dug-over soil in rows
    allotments:
      osm: {landuse: [allotments]}
      attributes:
        colours: ["#8a9a5f", "#7f9058"]
        recipe: field
        detail: {furrow: {probability: 1.0, min_area_m2: 300, coverage: [0.5, 0.8], max_area_m2: 20000}, tone_per_ha: 8}
    # fruit trees in grass
    orchard:
      osm: {landuse: [orchard]}
      attributes:
        colours: ["#7fae62", "#76a55a"]
        recipe: field
        detail: {furrow: {probability: 0.0}, headland: {keep: 0.0}}
    # mown or grazed grass: no furrows, no dirt headlands
    meadow:
      osm: {landuse: [meadow, grass]}
      attributes:
        colours: ["#7aa860", "#84b068", "#72a058"]
        recipe: field
        detail: {furrow: {probability: 0.0}, headland: {keep: 0.0}}
    # the open ground of the built-up area (street sides, greens, gardens of no property): grass, the asphalt is the OSM
    # ribbon on top (same shades as the grass of its recipe, detail.village)
    village:
      osm: {landuse: [residential]}
      attributes:
        colours: ["#86b362", "#7aa858"]
        recipe: village
    # Crops (#328): drawn-only ground types, a ground patch of one of them is a crop field. Terrain colour here; the
    # draped ground, plants, artifacts, edge and baulk are the `crop` recipe (detail.crop below), and `detail` lays the
    # crop's own numbers over it. Cosmetic only: nothing collides, nothing blocks a bullet. A field no one painted keeps `field`.
    crop_grain:
      attributes:
        colours: ["#c8a951", "#bf9f47"]
        recipe: crop
        detail:
          ground_colours: ["#cdb055", "#c2a44a"]
          edge: {mode: feather, feather_m: 14.0, plant_falloff_m: 10.0}
          tramlines: {enabled: true}
          stubble: {probability: 0.22}
          plants:
            - {kind: crop_wheat, spacing_m: 1.0, row_m: 0.0, scale: [0.85, 1.25], density: 0.95, noise_amp: 0.3}
          artifacts:
            extras:
              - {kind: art_hay_pile, probability: 0.10, place: corner, group: [1, 1], scale: [0.9, 1.2], radius_m: 1.6, sep_m: 3.0}
            items:
              - {kind: art_hay_bale_round, weight: 0.40, place: corner, group: [1, 3], scale: [0.95, 1.1], radius_m: 1.2, sep_m: 2.4}
              - {kind: art_hay_bale_square, weight: 0.25, place: corner, group: [1, 4], scale: [0.95, 1.05], radius_m: 0.9, sep_m: 1.6}
              - {kind: art_hay_pile, weight: 0.20, place: edge, group: [1, 1], scale: [0.9, 1.2], radius_m: 1.6, sep_m: 3.0}
              - {kind: art_baler, weight: 0.15, place: edge, group: [1, 1], scale: [1.0, 1.0], radius_m: 2.2, sep_m: 5.0}
    crop_corn:
      attributes:
        colours: ["#47703a", "#3e6633"]
        recipe: crop
        detail:
          ground_colours: ["#4a7a35", "#40702f"]
          # the plants keep their wall; the ground still blends over feather_m
          edge: {mode: wall, feather_m: 10.0, plant_margin_m: 0.7, plant_falloff_m: 0.0, plant_jitter_m: 0.15}
          headland: {keep: 0.3, radius_m: [0.7, 1.4]}
          plants:
            - {kind: crop_corn, spacing_m: 0.75, row_m: 1.4, scale: [0.9, 1.15], density: 0.97, noise_amp: 0.1}
          artifacts:
            extras:
            items:
              - {kind: art_scarecrow, weight: 0.5, place: interior, group: [1, 1], scale: [0.95, 1.1], radius_m: 0.9, sep_m: 12.0}
    crop_potato:
      attributes:
        colours: ["#6e5238", "#664b33"]
        recipe: crop
        detail:
          ground_colours: ["#6b4f35", "#634830"]
          texture: soil_rows
          edge: {mode: feather, feather_m: 11.0, plant_falloff_m: 8.0}
          plants:
            - {kind: crop_potato, spacing_m: 0.55, row_m: 0.9, scale: [0.8, 1.15], density: 0.92, noise_amp: 0.25}
          artifacts:
            extras:
            items:
              - {kind: art_potato_box, weight: 0.45, place: corner, group: [1, 4], scale: [0.95, 1.05], radius_m: 0.8, sep_m: 1.4}
              - {kind: art_sign_potatoes, weight: 0.25, place: edge, group: [1, 1], scale: [1.0, 1.0], radius_m: 0.6, sep_m: 8.0}
              - {kind: art_grain_bag, weight: 0.30, place: corner, group: [1, 3], scale: [0.95, 1.05], radius_m: 0.7, sep_m: 1.2}
    crop_rapeseed:
      attributes:
        colours: ["#a9b83a", "#9fae34"]
        recipe: crop
        detail:
          ground_colours: ["#adbb3c", "#a2b232"]
          edge: {mode: feather, feather_m: 15.0, plant_margin_m: 0.3, plant_falloff_m: 11.0}
          tramlines: {enabled: true}
          plants:
            - {kind: crop_rapeseed, spacing_m: 0.8, row_m: 0.0, scale: [0.85, 1.3], density: 1.0, noise_amp: 0.2}
          artifacts:
            extras:
              - {kind: art_sprinkler, probability: 0.12, place: edge, group: [3, 5], scale: [1.0, 1.0], radius_m: 0.8, sep_m: 5.0, line: true}
            items:
              - {kind: art_sprinkler, weight: 0.5, place: edge, group: [1, 2], scale: [1.0, 1.0], radius_m: 0.8, sep_m: 6.0}
              - {kind: art_tyre, weight: 0.5, place: corner, group: [1, 4], scale: [0.95, 1.05], radius_m: 0.7, sep_m: 1.4}
    # an empty ploughed field: furrow ground, no plants
    crop_bare:
      attributes:
        colours: ["#85694a", "#7d6244"]
        recipe: crop
        detail:
          ground_colours: ["#8a6d4b", "#7f6444"]
          texture: dirt
          edge: {mode: feather, feather_m: 10.0, plant_falloff_m: 6.0}
          fallow: {probability: 0.0}
          plants: []
          artifacts:
            extras:
            items:
              - {kind: art_plough, weight: 0.4, place: edge, group: [1, 1], scale: [1.0, 1.0], radius_m: 2.0, sep_m: 5.0}
              - {kind: art_wood_stack, weight: 0.25, place: corner, group: [1, 2], scale: [0.95, 1.1], radius_m: 1.3, sep_m: 2.4}
    field:
      attributes:
        colours: ["#72996b", "#7aa072", "#6a9163"]
        recipe: field

# --- Chunking -------------------------------------------------------------------------------
chunking:
  # Edge of a square chunk in metres, on a grid anchored at the local origin (map centre).
  # A parcel belongs to the chunk containing its anchor point.
  size_m: 250

# --- Buildings (rules stage) ----------------------------------------------------------------
# One entry per building in data/village/work/buildings.json. Order of precedence for every value:
#   1. pipeline/config/overrides.yaml (see there)
#   2. OSM tags: height, building:levels, roof:shape, roof:levels
#   3. `types`: class chosen by the OSM building=<value> tag
#   4. `areas`: class chosen by footprint area (first entry whose max_area_m2 >= area)
# Everything else (jitter, hipped-or-gabled, colours) comes from a random generator seeded with
# sha256(parcel id + ":" + building id), so the same input always gives the same map.
buildings:
  # building:levels -> height. height_m is to the top of the roof (as in OSM), the eave
  # (wall top) is height_m minus the roof rise.
  metres_per_level: 3.0
  # roof:levels -> roof rise, per roof level.
  metres_per_roof_level: 1.5
  # Walls never get lower than this; a pitched roof is flattened to fit.
  min_eave_height_m: 2.4
  # Pitched roofs rise at most this much; a rise below min_roof_rise_m becomes a flat roof.
  max_roof_rise_m: 5.0
  min_roof_rise_m: 0.5
  # A pitched roof needs the footprint to fill at least this fraction of its minimum rotated
  # rectangle (the ridge runs along the rectangle's longest side). L- and U-shapes get a flat roof.
  min_roof_fill: 0.8
  # Heights from classes get a random offset in +-height_jitter_m (rounded to 0.1 m).
  height_jitter_m: 0.6
  # OSM roof:shape -> our roof type (flat, gabled, hipped). Unlisted shapes are ignored.
  roof_shapes:
    flat: flat
    skillion: flat   # mono-pitch is not modelled
    gabled: gabled
    gable: gabled
    hipped: hipped
    half-hipped: hipped
    pyramidal: hipped
  # Class fields: height_m (to the roof top), roof (flat | gabled | hipped, or a mapping of
  # type -> weight, e.g. {gabled: 3, hipped: 1}), pitch_deg (pitched roofs; default 30).
  types:
    shed: {height_m: 3.0, roof: flat}
    hut: {height_m: 3.0, roof: flat}
    carport: {height_m: 3.0, roof: flat}
    garage: {height_m: 3.2, roof: flat}
    garages: {height_m: 3.2, roof: flat}
    roof: {height_m: 3.5, roof: flat}
    barn: {height_m: 8.0, roof: gabled, pitch_deg: 20}
    farm_auxiliary: {height_m: 6.0, roof: gabled, pitch_deg: 20}
    stable: {height_m: 5.5, roof: gabled, pitch_deg: 20}
    industrial: {height_m: 8.0, roof: flat}
    warehouse: {height_m: 8.0, roof: flat}
    commercial: {height_m: 7.0, roof: flat}
    retail: {height_m: 6.5, roof: flat}
    apartments: {height_m: 12.0, roof: flat}
    church: {height_m: 11.0, roof: gabled, pitch_deg: 35}
    chapel: {height_m: 7.0, roof: gabled, pitch_deg: 35}
  # Fallback classes by footprint area in m2, checked top to bottom; the last has no limit.
  areas:
    - {name: tiny, max_area_m2: 25, height_m: 3.0, roof: flat}
    - {name: small, max_area_m2: 60, height_m: 4.5, roof: gabled}
    - {name: house, max_area_m2: 300, height_m: 6.5, roof: {gabled: 3, hipped: 1}}
    - {name: large, height_m: 8.0, roof: gabled, pitch_deg: 15}
  # Flat colours as #rrggbb. Wall and roof are picked from these lists by the seeded generator.
  # Muted warm walls; red/brown/grey roofs. Flat roofs use the `flat` list.
  colours:
    walls: ["#e8dcc0", "#d9c7a0", "#cfb48c", "#e6cfc0", "#d8c0b0", "#ece4d0", "#c9b8a0", "#dcd2b8"]
    roofs: ["#a8442f", "#b5523a", "#8c3a2a", "#7a4a35", "#6b5a4c", "#5e5e63", "#7c7f86"]
    flat_roofs: ["#6a6a6e", "#7c7f86", "#8a8478", "#5c5f66"]

# --- Terrain (terrain stage) ----------------------------------------------------------------
# data/village/raw/dmr5.tif (DMR 5.0, EPSG:3046) is resampled bilinearly into a regular grid in the local
# frame. Chunk edges are grid lines, so neighbouring chunks share their border vertices exactly.
# Terrain exists only where the DMR raster covers: a grid cell is meshed only when all four of
# its corners lie inside the raster (no clamping, no invented ground); chunks without such cells
# get no terrain nodes. Heights for objects outside coverage (e.g. a far building) are clamped to
# the grid edge.
terrain:
  # Wanted grid step in metres. Each chunk is divided into an even number of cells, so the real
  # step is chunk size / round_to_even(chunk size / grid_step_m) (4.03 m for 4 m and 250 m chunks).
  grid_step_m: 4
  # Ground is flattened to the mean elevation of a building footprint: every cell touching the
  # footprint grown by this margin is made flat ...
  flatten_margin_m: 2
  # ... and the terrain blends back to the natural height over this many metres around it.
  flatten_blend_m: 6
  # The collision mesh uses every n-th grid vertex (coarser, uniform colour). Must be 1 or 2.
  collision_decimate: 2
  # Flat face colours by the parcel kind under the face centre. A list is a set of shades; one
  # is picked per parcel (seeded by the parcel ID), so parcels read as patches.
  # Around the outline of ground of these kinds the face colour is the mean of the colours within radius_m, so a forest
  # fades into the field or meadow beside it over a band of about twice that width instead of ending at a line. The outline of
  # swamp ground (detail.swamp) is faded the same way.
  colour_blend: {kinds: [forest], radius_m: 12}
  # Parcel kinds; the ground types carry their own colours (ground.types).
  colours:
    building_plot: ["#c9b78f", "#c2b088"]
    garden: ["#8fbf6a", "#83b562", "#9bc673", "#8ab868"]
    # terrain under no parcel and no ground area (the first shade is used)
    other: ["#72996b", "#7aa072", "#6a9163"]

# --- Water (water stage of export; bed.py, water.py) --------------------------------------
# Every water body (a water parcel, or a ground patch with water_y) gets a natural bed generated from its outline, and
# the terrain under it is carved to that bed. Depths in metres.
water:
  # Water bodies that are rivers (current, pools and riffles, outer bends deeper); the rest are static (ponds, lakes).
  # The ids are parcel, ground area or patch IDs; a patch piece "GP-0023.2" counts as "GP-0023". The Morava is seven parcels.
  river_ids: [P-0901, P-0534, P-1180, P-1184, P-1378, P-1597, P-1596]
  # Water ground areas are numbered by place ("A-0007") and move with the inputs, so a body is also a river when its outline
  # is at least this long (village map: the Morava's two bodies are 497 m and 4718 m, the longest pond 339 m).
  river_min_length_m: 400
  bed:
    # Grid of the depth in water.json: cells of this size, and the least depth inside an outline.
    cell_m: 2.0
    min_depth_m: 0.1
  # The terrain under a body is lowered to its bed; a bank standing above the surface is cut down to it over this
  # many metres outside the outline (never raised), so banks meet the water without a step.
  carve_blend_m: 4.0
  river:
    mid_depth_m: 2.5  # typical mid-channel depth
    pool_depth_m: 3.5  # deepest pool: the body's max_depth (edits.json) when it has one
    riffle_depth_m: 0.8  # shallowest riffle (wadeable)
    # Pools and riffles follow a seeded value-noise pattern along the flow (the body's main axis). Bars every
    # 60 to 120 m: a lattice of about pattern_m, jittered by the seed per body.
    pattern_m: 60
    # Across the flow the pattern changes slowly, so the bars run across the channel.
    cross_m: 150
    # Pattern values below this are riffles (the shallow runs); the change to a riffle takes about RIFFLE_RAMP.
    riffle_below: -0.35
    # The bed reaches its depth this far from the bank: banks shelve.
    shelf_m: 6
    # On the outside of a bend the shelf is shorter by this share at a full bend (steeper banks).
    outer_shelf_steepness: 0.4
    # The bank curvature (1/m) of a full bend: 0.02 is a bend of radius 50 m (gentler bends count for less).
    bend_curvature_per_m: 0.02
    # Extra depth on the outside of a full bend.
    bend_depth_m: 0.6
  pond:
    max_depth_m: 1.5  # the shallow bowl of a pond or lake (its max_depth in edits.json overrides it)
    shelf_m: 5
    pattern_m: 30  # a little irregularity on the bottom
    pattern_gain: 0.1  # the bottom dips to (1 - this) of max_depth_m in places, never deeper than max_depth_m

# --- Ground patches (export, patch-run) ---------------------------------------------------
ground_patches:
  # The preview of a ground patch (hand-drawn ground, edits.json; the editor shows it before the next full run) floats
  # this far above the terrain surface ...
  lift_m: 0.03
  # ... and this far above a road ribbon where it covers one (so it never z-fights with it).
  road_lift_m: 0.02

# --- Roads (roads stage) --------------------------------------------------------------------
# Ribbons from OSM highways in normalised/highways.geojson, draped on the terrain. A higher road
# class is lifted a hair above a lower one; ribbons of one class and different colour meeting at a
# node are split along the bisector instead of stacked, so nothing z-fights.
# roads.json: nodes are way ends and shared vertices, edges run between them.
roads:
  # Ribbon sample spacing along a way, in metres (the ribbon follows the terrain at this step).
  sample_step_m: 2
  # Ribbons float this far above the terrain surface.
  lift_m: 0.05
  # Width in metres by highway value (an OSM `width` tag wins, then lanes * lane_width_m).
  # Highway values not listed are not built.
  lane_width_m: 3.0
  widths:
    motorway: 10
    trunk: 9
    primary: 8
    secondary: 7
    tertiary: 6
    unclassified: 5
    residential: 5
    living_street: 4.5
    service: 3.5
    track: 3
    path: 1.5
    footway: 1.5
    cycleway: 2
    pedestrian: 3
  # Draw order of classes (later = lifted slightly higher at overlaps).
  order: [path, footway, cycleway, pedestrian, track, service, living_street, residential, unclassified, tertiary, secondary, primary, trunk, motorway]
  # OSM surface values that count as unpaved (gravel colour); any other tagged surface is paved.
  # Without a surface tag: the classes in unpaved_by_default are unpaved, the rest paved.
  unpaved_surfaces: [unpaved, gravel, fine_gravel, compacted, ground, dirt, earth, grass, sand, mud, pebblestone]
  unpaved_by_default: [track, path]
  colours:
    asphalt: "#8a8c90"
    gravel: "#a89c84"
    path: "#9a8a6c"

# --- Props: fences and trees (props stage) --------------------------------------------------
# Everything is seeded from sha256(parcel id + ":" + purpose), so reruns give identical props.
props:
  fences:
    # Parcels of these kinds get a fence on their boundary. A garden counts only when a building
    # is within garden_near_building_m.
    kinds: [building_plot, garden]
    garden_near_building_m: 25
    # Fraction of eligible parcels that get a fence (seeded per parcel).
    probability: 0.5
    height_m: 1.2
    thickness_m: 0.08
    # A fence is built from boxes of at most this length.
    section_m: 4
    colour: "#8a6a47"
    # Optional `type` (picket, wire, brick_red, brick_white, stone_wall, concrete; see edits.py
    # FENCE_TYPES) draws the rule fences in that textured style instead of the plain box, and an
    # optional `column` swaps its posts (edits.py COLUMN_TYPES). `colour` is then the tint. Each
    # fenced parcel gets one more node per texture, so mind the draw calls in the village.
    # type: picket
    # Boundary stretches within this distance of a building are not fenced.
    building_clearance_m: 0.8
    # Boundary stretches within this distance of a road centreline are not fenced.
    road_clearance_m: 0.5
    # Boundary stretches that face a road (within gate_road_within_m of a carriageway) get a gap of this
    # length for a gate (0 = no gap), centred on the middle of the longest such stretch. Stretches already
    # fenced for another parcel (shared boundary) are not fenced twice.
    gate_gap_m: 3
    gate_road_within_m: 4
    # Emit fence collision boxes (props_collision node). They are about half of all triangles of a
    # chunk file; off, fences are visual only.
    collision: false
  trees:
    # Every tree comes from the orthophoto detector (props.ortho_trees; make ortho-trees writes data/village/ortho/trees.json
    # and the canopy mask); there are no rule-based, OSM or shore trees. Without ortho data there are no trees.
    # Cap on trees per chunk (0 = no cap); surplus trees are dropped by a position hash, so the result is stable.
    max_per_chunk: 0
    building_clearance_m: 3.5
    road_clearance_m: 2.0
    # Trees keep this far from placed objects (objects.json, see config/edits.json).
    object_clearance_m: 1.0
    # Tree size: trunk height and canopy edge in metres, scaled by a seeded factor in [0.8, 1.25].
    trunk_height_m: 1.8
    trunk_width_m: 0.35
    canopy_m: 2.6
    trunk_colour: "#6b4a2f"
    canopy_colours: ["#4f8f45", "#5a9a4c", "#468040"]
    forest_canopy_colours: ["#2f6a3a", "#285e33"]
    # The trees planted inside the detected canopy. A forest seen from above is nearly closed (crowns 5-7 m across): about one
    # tree per 40 m2, 4-5 m apart, crown edge canopy_m * canopy_crown_scale (4.4-6.5 m). The standalone trees keep the crown
    # radius the detector measured.
    ortho:
      canopy_per_1000m2: 25.0
      canopy_min_spacing_m: 4.0
      canopy_crown_scale: [1.7, 2.5]
      # Age classes of the forest trees (seeded per tree from its position): `share` is the fraction of the forest, `scale`
      # multiplies the crown scale above, so it grows the whole tree (a giant is taller, wider, thicker). Shares need not sum to 1.
      age_classes:
        - {name: young, share: 0.25, scale: 0.8}
        - {name: mature, share: 0.60, scale: 1.0}
        - {name: giant, share: 0.15, scale: 1.25}
    # Stands (#287): the forest is not one mix. A seeded Voronoi field over the map (cells of `cell_m`, one seed each, its type drawn
    # by `share`) gives every forest tree a stand (props.Stands; trees.json "stand"); near water (`swamp`) overrides it.
    # `cone_share`: fraction of conifers (rest broadleaf boxes); `scale`: multiplies the tree's size (a number or [lo, hi] drawn per
    # tree); `keep`: fraction of the planted trees that stay (< 1: sparser). A thicket also gets extra trees up to
    # `density_factor` times the density, at least `spacing_scale` times the canopy spacing from the others (young, dense growth).
    # Village: net about +1% trees (thicket adds, birch and swamp thin). Remove `stands` for the old uniform forest.
    stands:
      cell_m: 110
      types:
        pine: {share: 0.30, cone_share: 0.95, scale: 1.1, keep: 1.0}
        birch: {share: 0.20, cone_share: 0.10, scale: 0.9, keep: 0.9}
        mixed: {share: 0.35, cone_share: 0.60, scale: 1.0, keep: 1.0}
        thicket: {share: 0.15, cone_share: 0.50, scale: [0.5, 0.65], keep: 1.0, density_factor: 1.6, spacing_scale: 0.65}
      # Forest trees within reach_m of water (a water ground area, or a water patch's wet area): sparse, mostly broadleaf, smaller.
      swamp: {reach_m: 25, keep: 0.45, cone_share: 0.2, scale: 0.8}
      # The forest wall steps down: trees within edge_m of the outer edge of the canopy mask (open ground; gaps narrower than
      # gap_m do not count) get "edge": true and scale `scale` = [at the edge, at edge_m] times their size, mostly broadleaf.
      edge: {edge_m: 8, scale: [0.6, 0.8], cone_share: 0.15, gap_m: 3}
    # The model of a forest tree (planted inside the detected canopy; the standalone trees above keep the trunk box and the two
    # stacked crown pieces sized by canopy_m). Tall clear trunk, crown on top: at the median scale 2.1 the crown starts about 5 m
    # up and the tree is about 20 m tall. All lengths are metres at scale 1 (multiplied by the tree's scale) and measured from the
    # ground at the trunk foot. The drawn mesh (propmeshes.tree_mesh), the collision solids (PropColliders.cs) and the model block
    # of trees.json all read these; change them here only.
    forest:
      # The trunk is a four-sided taper: trunk_width_m wide at its foot (0.2 m below ground), trunk_top_ratio times that at the
      # top. It rises into the crown (past the crown base), which hides its end. Solid for players, like any trunk.
      trunk_width_m: 0.3
      trunk_height_m: 4.4
      trunk_top_ratio: 0.55
      # Far (baked) trunk colour, close to the near pack bark (pines, TallRound, Tree_04 #584b3a; Round_01..05 #473c30, Tree_01..03 #6b5c48,
      # sampled median) so the swap at near_m does not show (#350). Unset: the global trunk_colour above (standalone trees keep that).
      trunk_colour: "#584b3a"
      # Conifer crown: stacked four-sided pyramids, [base height, base half-width, apex height]. 6 triangles each, base included.
      cone_tiers: [[2.4, 1.25, 5.4], [4.2, 0.95, 7.6], [6.2, 0.62, 9.5]]
      # Broadleaf crown: stacked boxes, [bottom height, half-width, top height]. Only the lowest has a drawn underside.
      box_tiers: [[2.4, 1.3, 5.6], [5.6, 0.85, 9.2]]
  # Solid ground objects of the forest (#287): fallen logs, stumps, boulders and root plates, placed by the props stage
  # (groundobjects.py), drawn as low-poly meshes baked into the chunk props meshes (propmeshes.ground_object_mesh, each carrying
  # its base point in UV2 like a tree) and solid for players and shots (ShooterCore GroundObjectColliders, built from
  # ground_objects.json). Only on the forest canopy of the orthophoto (props.trees.ortho) that lies on ground of the `ground_kinds`
  # types, never on a property (parcel of kind avoid_parcel_kinds), nor within the clearances of a building, a road or path, a
  # placed object or water, and never within trunk_clearance_m of a tree trunk or on another ground object. Seeded per 25 m
  # cell, so reruns give identical output. Densities are per hectare of canopy before the clearances (about 70-100% of them are placed); objects come in clumps (`clump` = [min, max]
  # objects around one centre, spread by `clump_sigma_m`), so the forest floor is patchy rather than evenly littered.
  # Village: about 185 ha of forest ground, so about 4,900 timber and rock objects (100,000 triangles), 260 anthills (1.4 per ha) and 200 burrows
  # (1.1 per ha) of 24 and 26 triangles each (measured on the village map).
  ground_objects:
    ground_kinds: [forest]
    avoid_parcel_kinds: [building_plot, garden]
    building_clearance_m: 3.5
    road_clearance_m: 2.0
    object_clearance_m: 1.0
    trunk_clearance_m: 0.3
    # Shape numbers at scale 1 (metres): the drawn mesh, ground_objects.json's model block and the collision solids all follow them.
    # The scale of an object multiplies them all (a log's length is its own `len`, not scaled).
    model:
      # A hexagonal prism lying on the ground: `diameter_m` across at the thick (root) end, `top_ratio` of that at the far end.
      log: {diameter_m: 0.45, top_ratio: 0.8}
      # A short hexagonal taper standing on the ground, `top_ratio` of its width at the top.
      stump: {width_m: 0.6, height_m: 0.6, top_ratio: 0.85}
      # A squashed irregular rock; `width_m` is its length along the heading (the other horizontal axis is 0.75-1 of that).
      boulder: {width_m: 1.0, height_m: 0.7}
      # An upturned root disc standing on edge (an octagonal slab): `radius_m` its radius, `thickness_m` along the log, `lift_m` the
      # height of its centre above the ground (the foot sinks a little).
      rootplate: {radius_m: 1.1, thickness_m: 0.4, lift_m: 0.9}
      # A conical ant mound: an octagonal base `width_m` across, `height_m` high at scale 1 (an object's width is drawn in size_m, its height follows).
      anthill: {width_m: 1.2, height_m: 0.8}
      # A low earth mound, `width_m` across and `height_m` high at scale 1, with a dark hole face on one side (the heading `rot` points at it).
      burrow: {width_m: 1.3, height_m: 0.4}
    log:
      per_ha: 24
      clump: [1, 3]
      clump_sigma_m: 5.0
      length_m: [4.0, 9.0]
      thickness_m: [0.3, 0.6]
      # The two ends of a log may differ this much in ground height (m): a longer drop and it would hang in the air or sink.
      max_end_drop_m: 0.3
      # Share of logs that have a root plate standing at their thick end.
      rootplate_share: 0.2
      rootplate_scale: [0.8, 1.3]
      colours: ["#5a4430", "#4e3c2a", "#66503a"]
    stump:
      per_ha: 13
      clump: [1, 3]
      clump_sigma_m: 4.0
      width_m: [0.4, 0.8]
      colours: ["#5f4731", "#6b5139"]
      top_colour: "#a98c63"
    boulder:
      per_ha: 5
      clump: [1, 4]
      clump_sigma_m: 2.5
      size_m: [0.6, 2.2]
      colours: ["#7d7b74", "#6e6d68", "#878379"]
    rootplate_colour: "#46362a"
    # Anthills: at the feet of the trees of the `stands` (pine and mixed; never in swamp ground, `detail.swamp`): per_ha of the canopy, one beside a
    # random tree of the stand, its centre foot_m from the trunk's edge beyond its own radius. Not in clumps.
    anthill:
      per_ha: 2.0
      stands: [pine, mixed]
      size_m: [0.8, 1.6]
      foot_m: [0.05, 0.8]
      colours: ["#6a5238", "#5e4a32", "#74603f"]
      top_colour: "#8a7550"
    # Burrows: low earth mounds with a hole, candidates_per_ha of the canopy at random, each kept with probability `base` plus `edge` when open
    # ground lies within edge_m (the forest edge) plus `slope` when the ground there climbs at least slope_min (rise over run, measured over
    # 1.5 m), so they gather at the edges and on slopes; about 1 per ha is placed on the village.
    burrow:
      candidates_per_ha: 5.0
      size_m: [1.0, 1.6]
      edge_m: 12.0
      slope_min: 0.15
      base: 0.15
      edge: 0.5
      slope: 0.5
      colours: ["#5c4631", "#523f2c"]
      hole_colour: "#1c1511"

# --- Ground detail (detail stage, `make detail`; docs/pipeline.md "Detail") ----------------------------
# Patches (flat colour or library texture, draped on the terrain, never overlapping: the first layer in
# detail.PATCH_PRIORITY wins) and clutter instances (kind, x, y, z, rot, scale; drawn by the game as instanced
# meshes near the player only) for every parcel except water. detail.area_type() maps a parcel to a recipe
# (garden, field, forest, road); the sections below are the recipes' numbers. Everything is seeded per parcel
# (sha256 of "<parcel>:detail:<purpose>"), so reruns give identical output.
# Budgets (village): patch triangles under ~150k in all, clutter.json under ~6 MB (about 150k instances).
detail:
  # Patches float this far above the terrain; water patches (ground_patches.lift_m, 0.03) are cut out of them.
  lift_m: 0.02
  # Parts of a parcel (clipped to the terrain coverage) smaller than this get no detail.
  min_parcel_m2: 4
  wall_clearance_m: 0.12
  fence_clearance_m: 0.08
  trunk_radius_m: 0.3
  road_clearance_m: 0.15
  # Placed objects (objects.json) keep detail off a circle of half their footprint diagonal plus this.
  object_clearance_m: 0.3
  # Hollow test (detail._hollow, Rust wet::hollow): how far below its surroundings the ground lies at a point, 0..1: the mean terrain
  # height on a ring of ring_m round it minus its own, over depth_m. Puddles and ordinary mud are more likely in hollows (times 1 + gain * hollow).
  hollow: {ring_m: 6.0, depth_m: 0.25, gain: 3.0}
  # Swamp ground (#287): ground of the types in `kinds` within the reach of water gets a wet floor instead of the plain one: a dark wet-earth
  # base (`colours`: the terrain's own colour there, faded into the ground beside it by terrain.colour_blend; not a patch), large `mud` patches, small `puddle` patches (flat dark standing water, optionally
  # in a mud rim of rim_m, 0 = none), moss as in any forest, and leaf litter and bare spots cut to a share (litter_factor, dirt_factor). The zone is the
  # one the swamp stand of trees stands in: props.wet_zone (water ground areas, wet areas of water patches) buffered by
  # props.trees.stands.swamp.reach_m. Cells of it carry the meadow's swamp mix (`swamp_mix` of meadow.zones). Patches only; no real water, no gameplay.
  # mud / puddle: one candidate per spacing_m cell, kept with keep times a noise (clump 0 = even .. 1 = bare gaps between thick clumps, clump_m the
  # size of a clump); radius, stretch along a random axis. Puddles are likelier in hollows (detail.hollow). Few large mud patches on purpose: patches are
  # cut at the 4 m terrain cells, so small many ones are what costs triangles (smaller blobs, 2-4.5 m every 8 m, cost 2.5x as many). Village: about 17.6 ha of
  # forest in the zone, +39k patch triangles for it (measured on the village map), plus +17k for the plain forest's mud.
  swamp:
    kinds: [forest, meadow]
    colours: ["#3a3024", "#342b20", "#40352a"]
    litter_factor: 0.15
    dirt_factor: 0.15
    mud: {spacing_m: 22.0, keep: 0.5, radius_m: [6.0, 11.0], stretch: 1.6, clump: 0.8, clump_m: 40.0}
    puddle: {spacing_m: 14.0, keep: 0.3, radius_m: [0.5, 2.0], stretch: 1.4, rim_m: 0.0, clump: 0.6, clump_m: 20.0}
  # Flood dike (recipe "dike", detail.py + dike.py): these parcels are the dike whatever their kind. The carriageway of the road
  # edges inside them is covered by a gravel track (texture dike_gravel: fine gravel, grass patches) a little wider than the
  # road with a wandering edge, the rest is flat grass with thick grass as clutter: tall grass and tufts, taller and a bit
  # sparser the further from the track (the dike's sides), tufts on the grass patches of the track.
  dike:
    parcels: ["P-0073", "P-0821", "P-0805"]
    # Parcels of which only a part is the dike (the rest keeps its own recipe): the ground within within_m of a road way.
    clips:
      P-1057: {osm_id: w825140517, within_m: 12}
      P-1021: {osm_id: w825140517, within_m: 12}
      P-0847: {osm_id: w825140519, within_m: 12}   # the dike's north end: the service road on from P-0073 through H to G
      P-0089: {osm_id: w825140519, within_m: 12}
      P-1059: {osm_id: w1148486728, within_m: 12}  # the dike hill reaches over the P-0073 line here (L1)
    # Regular roads beside the dike's own pebbled road: no track and no lawn over them (P-0821: the grass track w825143074, drawn as L2
    # and L3, runs alongside the gravel pair w150827706 and w192898627, which is the dike's road).
    not_track: [w825143074]
    track_width_m: 1.5       # the gravel track: this wide plus the wandering of its edges (about 2.2 m on average); the road under it is wider, the lawn covers the rest
    track_wobble_m: 0.7      # how far the edge of the track wanders out beyond that, each side (waves of 1.4 to 16 m)
    track_lift_m: 0.08       # above the terrain: over the road ribbon (roads.lift_m 0.05 plus 3 mm per class rank) so the texture shows
    spill:                   # loose pebbles beyond the edge of the track: blobs every spacing_m (varied), radius, how far out
      {spacing_m: 0.9, radius_m: [0.1, 0.38], reach_m: 0.45}
    piece_m: 8.0             # the texture is laid in pieces of this length, each along its own direction and start
    lawn_colours: ["#86b362", "#7aa858", "#6e9c50"]
    border:                  # the parcel's outline is only a guide: the green flows over it, at random
      inward_m: 0.0          # the lawn's edge lies this much inside the parcel line at most (0: never, the plot colour would show) ...
      outward_m: 3.5         # ... and this much outside at most (smooth waves of 7 to 32 m)
      blob_spacing_m: 1.6    # loose lawn blobs beyond the edge: about one per this many metres of it (varied)
      blob_radius_m: [0.3, 1.1]
      blob_reach_m: 4.5      # how far out they lie (most close to the edge, smaller the further out)
      fade_m: 3.0            # the grass is half as dense on the parcel line, full this far inside, gone this far outside
      lawn_lift_m: 0.07      # above the terrain: over the neighbours' own patches (detail.lift_m) and over the road ribbons (roads.lift_m 0.05 plus 3 mm per class rank), under the track
    grass:
      spacing_m: 0.95
      scale: [0.95, 1.4]
      kinds: [[tall_grass, 0.55], [tuft, 0.33], [straw, 0.12]]
      reach_m: 9.0           # the distance from the track at which the scale has grown by reach_scale
      reach_scale: 0.6
    patch_tuft: {spacing_m: 0.3, keep: 0.5, scale: [0.7, 1.1]}
  # Hard cap of instances per chunk and kind (0 = none); surplus ones are dropped by a position hash. (Kinds the yards and verges
  # grow: the tall and the flower kinds have their own caps; the meadow's kinds are generated by the game, not stored.)
  caps_per_chunk: {tuft: 5000, flower: 700, pebble: 4000, rock: 300, leaf: 2500, stick: 700, fern: 900, tall_grass: 2500, clover: 1500, straw: 1500, reed: 600, weed: 800, dandelion: 300, daisy: 300, red_clover: 300, buttercup: 300, poppy: 300, cornflower: 300, yarrow: 300, tulip: 400, sunflower: 200, spike: 300, rose: 200}
  # Gravel and dirt blobs along the carriageway edge of these highways (every parcel they reach gets them).
  verge:
    highways: [residential, tertiary, service, track]
    keep: 0.2
    step_m: [3.0, 6.0]
    offset_m: [0.1, 0.7]
    radius_m: [0.4, 0.9]
    stretch: [1.6, 2.8]
    vertices: 8
    gravel_share: 0.55
  lawn:
    # A lawn colour is the fixed one at terrain_mix 0 and the parcel's terrain colour times its shade at 1.
    # A tan plot (mix 0.25) gets drawn green lawn pieces; a green garden (mix 1) only tones of its own green.
    colours: ["#8fbf6a", "#83b562", "#9bc673"]
    shades: [0.97, 1.0, 1.04]
    tone_colours: ["#a6d27f", "#76a856"]
    tone_shades: [1.12, 0.86]
    terrain_mix: {garden: 1.0, building_plot: 0.25}
    # Lawn pieces (only where the lawn is drawn): blobs on a spacing, the share kept sets how green the plot is.
    blob_spacing_m: 5.0
    blob_radius_m: [2.5, 4.5]
    keep: 0.5
    tone_spacing_m: 8.0
    tone_radius_m: [1.6, 3.2]
    tone_keep: 0.12
  dirt:
    # Splash and wear along walls: a blob every ~wall_spacing_m along a building outline.
    wall_spacing_m: 4.0
    wall_keep: 0.2
    wall_radius_m: [0.4, 0.8]
    # Worn bare patches in the open yard, per 1000 m2.
    open_per_1000m2: 2
    open_radius_m: [0.5, 1.0]
    blob_vertices: 8
  gravel:
    # A path from the gate (the middle of the longest unfenced stretch of the boundary within frontage_m of
    # the carriageway, at least min_gate_m long) to the nearest building; none without a gate or a building.
    width_m: [1.0, 1.5]
    wobble_m: 1.0
    min_length_m: 2.5
    max_length_m: 25
    frontage_m: 4.0
    min_gate_m: 1.5
  beds:
    per_1000m2: 2.0
    max: 2
    size_m: [3.2, 1.7]
    rim_m: 0.4
    building_distance_m: 2.5
    fence_distance_m: 1.0
  litter:
    # Leaf litter under a tree: blobs of canopy_m * scale * radius_factor around the trunk.
    radius_factor: 0.7
    blobs_per_tree: 1
  # Tint of the grasses and ferns (the byte after the scale in clutter.json; 128 = as drawn, lower = fresher, higher = drier).
  # The base is a smooth noise over the ground (meadow.py), so a stretch of grass has one mood; these shift it in tint units:
  # grass within fresh_m of a fence or a wall stands unmown and fresh, grass within water_m of water likewise.
  tint:
    fence_fresh: -40
    fresh_m: 1.5
    water_fresh: -45
    water_m: 6.0
  # Garden and plot clutter. spacing_m: grid of candidates (one per cell, jittered); the other numbers are the
  # share of candidates kept by place.
  clutter:
    # Grass within unmown_m of a fence or wall (nobody mows there) is tall_grass with probability `tall`, the rest of the lawn is
    # clover with probability `clover`, else tuft. clump / clump_m: growth in clumps with gaps (see detail.meadow).
    tuft:   {spacing_m: 0.7,  lawn: 0.09, edge: 0.5,  edge_m: 1.0, clump: 0.7, clump_m: 5.0, unmown_m: 0.9, tall: 0.75, clover: 0.18, scale: [0.8, 1.3]}
    # Flowers of a yard are garden flowers (the wild ones stay on meadows and verges): a cluster is one species, picked by share,
    # of `size` plants within cluster_radius_m.
    flower:
      cluster_spacing_m: 6.0
      cluster_keep: 0.25
      cluster_radius_m: 0.5
      scale: [0.8, 1.2]
      species:
        tulip:     {share: 0.40, size: [3, 6]}
        spike:     {share: 0.25, size: [2, 4]}
        sunflower: {share: 0.20, size: [1, 3]}
        rose:      {share: 0.15, size: [1, 2]}
    pebble: {spacing_m: 0.35, gravel: 0.35, dirt: 0.1, wall: 0.2, wall_m: 0.7, scale: [0.6, 1.4]}
    rock:   {spacing_m: 3.0,  dirt: 0.25, lawn: 0.04, edge: 0.12, edge_m: 1.5, scale: [0.6, 1.5]}
    leaf:   {spacing_m: 0.45, litter: 0.3, tree_lawn: 0.1, tree_reach_m: 1.6, scale: [0.8, 1.2]}
    stick:  {spacing_m: 1.0,  litter: 0.25, scale: [0.7, 1.3]}
  # What the game draws for each crop instance kind (crops.json): `plant` kinds are the
  # field's crop, `artifact` kinds the sparse props. `asset`: an asset id of assets/manifest.json; `synty`: prefab names (full, `SM_...`) of the
  # private Synty POLYGON Farm pack, id `pack:synty-farm/<name>` (several = variants by position; placeholder without the pack). `cap`: at most this many per chunk (a stable hash drops the rest).
  crop_kinds:
    crop_wheat:   {role: plant, synty: [SM_Prop_Plant_Wheat_Optimised_01, SM_Prop_Plant_Wheat_Optimised_02, SM_Prop_Plant_Wheat_Optimised_03, SM_Prop_Plant_Wheat_Optimised_04], cap: 30000}
    crop_corn:    {role: plant, synty: [SM_Prop_Plant_Corn_01], cap: 20000}
    crop_potato:  {role: plant, synty: [SM_Prop_Plant_Potato_01_M], cap: 25000}
    crop_rapeseed: {role: plant, asset: "pack:drycastle-generated-models/rapeseed_plant", cap: 25000}
    art_hay_bale_round:  {role: artifact, synty: [SM_Prop_Hay_Bale_Round_01], cap: 400}
    art_hay_bale_square: {role: artifact, synty: [SM_Prop_Hay_Bale_Square_01], cap: 400}
    art_hay_pile:        {role: artifact, synty: [SM_Prop_Hay_Pile_01], cap: 200}
    art_baler:           {role: artifact, synty: [SM_Veh_Attach_Baler_01], cap: 100}
    art_scarecrow:       {role: artifact, synty: [SM_Prop_Scarecrow_01], cap: 100}
    art_tractor:         {role: artifact, synty: [SM_Veh_Tractor_01], cap: 100}
    art_potato_box:      {role: artifact, synty: [SM_Prop_Box_Potato_01], cap: 400}
    art_sign_potatoes:   {role: artifact, synty: [SM_Prop_Sign_Potatoes_01], cap: 100}
    art_grain_bag:       {role: artifact, synty: [SM_Prop_GrainBag_01], cap: 400}
    art_sprinkler:       {role: artifact, synty: [SM_Prop_Sprinkler_01], cap: 200}
    art_tyre:            {role: artifact, synty: [SM_Prop_Tyre_01], cap: 400}
    art_plough:          {role: artifact, synty: [SM_Veh_Attach_Plough_01], cap: 100}
    art_wood_stack:      {role: artifact, synty: [SM_Prop_Wood_Stack_01], cap: 200}
  # Meadow and field (ground type field).
  field:
    tone_colours: ["#b7aa6c", "#7fa56d"]
    tone_shades: [1.14, 0.88]
    terrain_mix: 0.45
    tone_per_ha: 3
    tone_radius_m: [3.0, 8.0]
    # Within edge_band_m of the boundary clutter is denser, and dirt headland blobs lie along it.
    edge_band_m: 4.0
    headland: {spacing_m: 12.0, keep: 0.15, radius_m: [1.0, 2.2], stretch: 2.2, vertices: 10}
    # A strip of furrows (soil_rows texture) in a share of the larger parcels.
    furrow: {probability: 0.06, min_area_m2: 2500, coverage: [0.3, 0.5], min_piece_m2: 200, max_area_m2: 4000}
    clutter:
      tuft:   {spacing_m: 1.0, edge: 0.2, dirt: 0.08, tone: 0.1, interior: 0.012, scale: [0.8, 1.4]}
      pebble: {spacing_m: 0.5, dirt: 0.1, edge: 0.005, scale: [0.6, 1.4]}
      rock:   {spacing_m: 4.0, edge: 0.06, dirt: 0.2, interior: 0.004, scale: [0.6, 1.6]}
      flower: {spacing_m: 2.0, tone: 0.08, interior: 0.012, scale: [0.8, 1.2]}
  # Crop field (ground types crop_*; crop.py). Base values: a type's `detail` (ground.types) lays its own
  # over them. Ground = flat tones (or a texture) over the patch; the edge blends into the colour of the ground that really
  # lies outside it (other ground area, road, water; `surround` where there is none) over feather_m in `steps` noise-dithered
  # bands, each band cut by the neighbour colour at that stretch of the edge (mode wall only makes the plants stop dead);
  # plants (instances, crops.json) thin out toward the edge; artifacts are a few clustered at corners/edges; a baulk strip lies
  # where two crop patches adjoin (their grounds blend over baulk.blend_m). Per patch (seeded by its id): `variety`, tramlines,
  # stubble stripe with bales, weedy fallow, spots, a pick of artifacts. Cosmetic only. Patch rows have ONE flat colour per
  # triangle (no vertex colours): a gradient is many small bands, so the cost is triangles ~ steps x perimeter.
  crop:
    ground_colours: ["#cdb055", "#c2a44a"]   # first: the base; the others: tone blobs (several = fallow)
    texture: null            # a library texture (soil_rows, dirt) for the ground instead of flat tones; turned along the rows
    tone_per_ha: 6           # blobs of each further ground colour (flat ground only)
    tone_radius_m: [2.5, 7.0]
    surround: "#72996b"      # the neighbour colour where nothing is known beside the edge (no ground unit there)
    edge:
      mode: feather          # feather | wall: plants thin out over plant_falloff_m | stop dead at plant_margin_m (corn). The ground blends in both.
      feather_m: 12.0         # ground colour blends from the neighbour's over this width (0 = none)
      steps: 14              # bands of the blend (8 or more reads as a gradient)
      wobble_m: 0.8          # how far each band's edge wanders (value noise), about a band width or more: the bands interleave
      wobble_lattice_m: 2.0
      vertex_m: 1.5          # a band edge has a vertex this often
      plant_margin_m: 0.4    # no plants this close to the edge (wall: the hard stop)
      plant_falloff_m: 6.0   # plant density 0 -> full over this width beyond the margin (0 = abrupt)
      plant_jitter_m: 1.2    # the plants' distance to the edge wanders by this (noise): a ragged thinning
      plant_jitter_lattice_m: 2.5
      # What lies beside the edge: a probe `probe_m` outside it every `sample_m`; its colour averaged over +-`smooth` samples
      # (so two neighbours blend along the edge) and grouped in steps of `colour_step` (levels) to keep the pieces few.
      neighbour:
        probe_m: 1.0
        sample_m: 2.0
        smooth: 2
        colour_step: 6
        road: "#8a7a58"      # beside a road: dry verge
        water: "#6b6446"     # beside water: damp bank
    # Dirt headland along the edge: blobs, kept in part, so the strip is broken. Not along a baulk.
    headland: {spacing_m: 2.5, keep: 0.5, radius_m: [0.9, 1.9], stretch: 2.0, vertices: 10, texture: dirt}
    # Between two adjoining crop patches: a strip of grass (or dirt), `width_m` in all (each side takes half), edge from noise.
    # The grounds of the two blend towards each other over blend_m (instead of edge.feather_m).
    baulk:
      width_m: [0.5, 1.0]
      shared_tol_m: 0.3      # patches this close count as adjoining
      min_shared_m: 3.0      # ... along at least this much of the edge
      step_m: 0.4
      blend_m: 12.0
      colours: ["#6f9a52", "#7da25a"]
      dirt_share: 0.3        # share of baulks that are bare dirt (one per pair)
      dirt_colour: "#8a7a58"
    # Per-patch variation (seeded by the patch id). Colour and height jitter only: no growth stages, no seasons.
    variety:
      tone_shift: 0.07       # ground colours x (1 +- this), plus a little per-channel drift
      plant_scale: [0.85, 1.15]   # every plant of the patch is this much taller/shorter
      # Row (and tramline, stubble) direction: the long side, rotated by a quarter turn (cross_share), or any angle (free_share);
      # then +- jitter_deg. Only rows (row_m > 0) and the turned textures show it.
      row_angle: {cross_share: 0.2, free_share: 0.25, jitter_deg: 10}
    # Tractor tracks: pairs of dark strips every spacing_m (one value per patch) through the rows, no plants on them, and dirt
    # strips along some edges. Off unless a type turns it on.
    tramlines:
      enabled: false
      spacing_m: [18.0, 24.0]
      track_width_m: 0.5
      track_gap_m: 1.8       # between the two tracks of a pair
      margin_m: 1.2          # they stop this far from the edge
      min_area_m2: 900
      colour: "#6e5a3c"
      mix: 0.6               # share of `colour` over the ground colour
      edge_strip: {probability: 0.6, edges: [1, 2], width_m: [1.2, 2.2], min_edge_m: 10.0, wobble_m: 0.3}
    # A harvested stripe: straw-coloured ground, no plants, round or square bales in a line on it. Off (0) unless a type sets it.
    stubble:
      probability: 0.0
      min_area_m2: 900
      coverage: [0.25, 0.5]  # share of the patch's area, a stripe along the rows from one side, noise-edged
      wobble_m: 1.5
      colours: ["#d3bd78", "#c9b068"]   # base, then the darker lines of the lanes
      row_spacing_m: 2.8     # lanes (a darker line every this far)
      row_width_m: 0.5
      bales: {lines: [1, 2], max: 16, round_share: 0.6, round: {spacing_m: 3.2, scale: [0.95, 1.1], radius_m: 1.2}, square: {spacing_m: 2.2, scale: [0.95, 1.05], radius_m: 0.9}}
    # Fallow: the patch draws as weedy grass-green ground, no crop plants (its type stays what it is, for the editor).
    fallow:
      probability: 0.15
      colours: ["#82a051", "#93a85a", "#7a8f4a"]   # base, then tone blobs of each
      tone_per_ha: 14
      tone_radius_m: [2.0, 6.0]
      flowers: {per_ha: 90, radius_m: [0.35, 0.6], colours: ["#e6d24a", "#eeece0", "#a47ab8", "#d4684a"]}
      max_artifacts: 2
    # Spots inside the field, placed where a noise is high (clumped): wet = darker ground, bare = soil, weeds = green clumps
    # (the crop plants in a clump stand `plant_scale` as tall). per_ha of the patch; radius_m; the lattice of the placement noise.
    spots:
      lattice_m: 16.0
      wet: {per_ha: 4.0, radius_m: [2.0, 5.0], darken: 0.82}
      bare: {per_ha: 3.0, radius_m: [0.8, 2.2], colour: "#8a7050"}
      weeds: {per_ha: 5.0, radius_m: [1.0, 3.0], colour: "#6f8c3e", plant_scale: 0.35}
    # Plants: one instance kind each (crops.json). spacing_m: step along the row (row_m > 0: rows row_m apart, along the
    # patch's row direction) or the jittered grid (row_m 0). density: share kept; noise_amp: patches of thinner growth.
    plants:
      - {kind: crop_wheat, spacing_m: 1.0, row_m: 0.0, scale: [0.85, 1.25], density: 0.95, noise_amp: 0.3}
    # Artifacts: each patch deals `kinds_per_patch` of the items' kinds, by weight; per_ha of the patch (min..max, at least `min` when
    # the patch is >= min_area_m2). place: corner (a cluster at a corner of the patch), edge (a spot on the edge), interior (alone
    # inside). group: how many in a cluster; sep_m: least distance between two of this kind; radius_m: plants stay this far from it.
    # extras: each tried once per patch with its probability (a lone tractor, a sprinkler line, a hay stack), on top of the count.
    artifacts:
      per_ha: 4.0
      min: 2
      max: 10
      min_area_m2: 400
      inset_m: 2.0
      cluster_m: 3.0
      kinds_per_patch: [1, 2]
      extras: []          # a type lists its own (grain: tractor, hay stack; rapeseed: tractor, sprinkler line)
      items: []
  forest:
    # Flat tone patches: the ground colour times tone_shades (tone_colours only when a forest has no ground colour).
    tone_colours: ["#5a9a48", "#2a5c32"]
    tone_shades: [1.2, 0.8]
    tone_per_ha: 9
    tone_radius_m: [2.5, 6.0]
    # Leaf litter (leaf_litter texture) under the trees: `blobs_per_tree` blobs of canopy_m * scale * radius_factor, each kept
    # with probability `keep`. Merged blobs make the thick litter stretches.
    litter: {radius_factor: 0.55, blobs_per_tree: 1, keep: 0.12}
    # Moss (moss texture, bright green): small irregular blobs, thick in the clumps of a noise (clump: 0 = even, 1 = bare gaps
    # between thick clumps; clump_m: size of a clump) and thin in the gaps. `tree`: at the feet of the trees (keep per tree, blob
    # radius, distance from the trunk); `interior`: over the open floor (one candidate per spacing_m cell, `keep` of them in a
    # thick clump, radius, stretch along a random axis). None within edge_m of the carriageway and its verges.
    moss:
      edge_m: 3.0
      clump: 0.9
      clump_m: 12.0
      tree: {keep: 0.04, radius_m: [0.6, 1.3], reach_m: [0.3, 1.4]}
      interior: {spacing_m: 9.0, keep: 0.25, radius_m: [1.5, 3.0], stretch: 1.5}
    # Mud (mud texture) outside the swamp, a few patches per hectare: in damp spots (one candidate per spacing_m cell, kept with keep times a
    # noise like moss's, times 1 + gain * hollow, see detail.hollow) and along the edge of the ways of `highways` (one candidate every
    # about spacing_m metres of the way, kept with `keep`, on a random side). Radius, stretch; a puddle (puddle texture) of
    # puddle_scale times the mud's radius sits in the middle of puddle_share of the patches.
    mud:
      damp: {spacing_m: 10.0, keep: 0.02, clump: 0.9, clump_m: 25.0}
      track: {highways: [track, path, footway], spacing_m: 30.0, keep: 0.5}
      radius_m: [1.4, 2.8]
      stretch: 1.5
      puddle_share: 0.33
      puddle_scale: [0.35, 0.65]
    dirt: {per_ha: 3, radius_m: [0.6, 1.4]}
    clutter:
      leaf:   {spacing_m: 0.8, litter: 0.1, tone: 0.01, interior: 0.003, scale: [0.8, 1.2]}
      stick:  {spacing_m: 1.5, litter: 0.06, tone: 0.01, interior: 0.004, scale: [0.7, 1.3]}
      rock:   {spacing_m: 5.0, dirt: 0.2, interior: 0.02, scale: [0.6, 1.6]}
      pebble: {spacing_m: 0.7, dirt: 0.2, scale: [0.6, 1.4]}
      tuft:   {spacing_m: 1.5, tone: 0.1, interior: 0.06, scale: [0.8, 1.3]}
      fern:   {per_tree: 0.45, group_max: 3, ring_m: [0.5, 1.8], scale: [0.8, 1.3]}
  # Village ground (ground type village: street sides, greens): grass on all of it beside the carriageway (OSM roads are the
  # only paved ground).
  village:
    grass_colours: ["#86b362", "#7aa858"]
    clutter:
      tuft:   {spacing_m: 0.6, grass: 0.3, dirt: 0.15, scale: [0.8, 1.3], kinds: [[tuft, 0.7], [tall_grass, 0.15], [clover, 0.15]]}
      pebble: {spacing_m: 0.4, gravel: 0.35, dirt: 0.1, scale: [0.6, 1.4]}
      rock:   {spacing_m: 4.0, grass: 0.03, scale: [0.6, 1.5]}
      flower: {spacing_m: 1.5, grass: 0.01, scale: [0.8, 1.2], kinds: [[daisy, 0.3], [dandelion, 0.3], [buttercup, 0.2], [red_clover, 0.2]]}
      leaf:   {spacing_m: 1.0, grass: 0.05, scale: [0.8, 1.2]}
  # Meadow: the game generates tufts, flowers, ferns, pebbles, leaves and sticks near the player on fields,
  # meadows and in forests from a coarse density raster (meadow.bin, see meadow.py) instead of stored instances.
  # A cell is cell_m wide; an instance lies within jitter_m of its centre, and a cell is on the raster only where
  # that whole window is free ground. Per layer: max_per_cell is the density at 255 (instances per cell), kinds
  # the clutter meshes and their shares (a species mix may change them), scale the span. Per parcel type and layer, as shares of
  # max_per_cell: interior, edge (within the recipe's edge band), tone (tone patches), litter (leaf litter),
  # tree (within tree_reach_m of a trunk), bare (dirt, gravel; replaces the rest). Smooth noise (noise_m lattice,
  # noise_amp strength) thins and thickens them in patches. The stored clutter of field and forest keeps only
  # the kinds in stored_kinds.
  meadow:
    cell_m: 2.0
    jitter_m: 0.85
    noise_m: 16.0
    noise_amp: 0.6
    tree_reach_m: 3.0
    # The game drops generated instances this close to a tree trunk (scaled by the tree's scale).
    trunk_reach_m: 0.7
    stored_kinds: [rock]
    # Clumps: a smoothed noise of clump_m makes growth patchy (clump 0 = none, 1 = bare gaps between thick clumps; the mean
    # stays near 1). unmown: density factor where nobody mows (within unmown_m of a fence, wall or building edge).
    clump_m: 6.0
    unmown_m: 1.5
    # Species zones (meadow.py, "Zones"): a Voronoi patch of patch_m metres takes one mix (index in `mixes`) from the
    # type's shares in `zones`; beside water (wet_m) the type's wet_mix, where nobody mows its unmown_mix, in half of
    # a field's edge band its edge_dry_mix. Dryness (tint bias, 8 = neutral, 10 tint units a step): dry_edge more in the
    # edge band, fresh_unmown / fresh_water fewer where nobody mows / beside water.
    patch_m: 6.0
    wet_m: 8.0
    fresh_unmown: 3
    fresh_water: 4
    zones:
      field:  {mixes: [[0, 0.28], [1, 0.17], [2, 0.10], [3, 0.10], [6, 0.10], [7, 0.10], [8, 0.15]], unmown_mix: 1, wet_mix: 4, edge_dry_mix: 2, edge_dry_share: 0.5, dry_edge: 4, swamp_mix: 9}
      forest: {mixes: [[5, 1.0]], swamp_mix: 9}
    # Per layer: kinds = what it makes and in what shares by default; `mixes` entries list the layers they change.
    layers:
      tuft:   {kinds: [[tuft, 1.0]], max_per_cell: 3.0, scale: [0.8, 1.4], clump: 0.75, unmown: 1.3}
      flower: {kinds: [[flower, 1.0]], max_per_cell: 1.0, scale: [0.8, 1.2], clump: 0.9}
      fern:   {kinds: [[fern, 1.0]], max_per_cell: 1.5, scale: [0.8, 1.3], clump: 0.5}
      pebble: {kinds: [[pebble, 1.0]], max_per_cell: 2.0, scale: [0.6, 1.4]}
      litter: {kinds: [[leaf, 0.8], [stick, 0.2]], max_per_cell: 3.0, scale: [0.8, 1.2], clump: 0.4}
      # Forest floor (only the forest section below gives it a density): moss mounds, fallen branches and big ferns.
      # A layer is at least one draw per 24 m tile in its reach (the farthest of its kinds, ClutterSettings.KindRangeM), merged into one mesh
      # while no kind has 48 instances in the tile: so the 60 m kinds share this one layer and the small ones (mushroom, stump_small, 40 m)
      # ride the litter layer's draws instead of a layer of their own. Dense near trunks (tree) and on leaf litter (litter) via the forest section below.
      floor:  {kinds: [[moss_mound, 0.4], [branch, 0.35], [fern_big, 0.25]], max_per_cell: 2.0, scale: [0.8, 1.3], clump: 0.7}
    mixes:
      # Grass profile and the flowers that dominate the patch (one species with strays); ids are what zones.<type>.mixes refer to.
      - {name: meadow, tuft: [[tuft, 0.65], [clover, 0.35]], flower: [[daisy, 0.55], [dandelion, 0.25], [buttercup, 0.2]]}                       # 0
      - {name: tall meadow, tuft: [[tall_grass, 0.8], [tuft, 0.2]], flower: [[red_clover, 0.6], [yarrow, 0.25], [daisy, 0.15]]}                   # 1
      - {name: dry, tuft: [[straw, 0.7], [tall_grass, 0.2], [tuft, 0.1]], flower: [[poppy, 0.6], [cornflower, 0.3], [daisy, 0.1]]}                # 2
      - {name: weedy, tuft: [[weed, 0.5], [tall_grass, 0.3], [tuft, 0.2]], flower: [[dandelion, 0.65], [yarrow, 0.2], [buttercup, 0.15]]}        # 3
      - {name: wet, tuft: [[reed, 0.55], [tall_grass, 0.3], [tuft, 0.15]], flower: [[buttercup, 0.8], [daisy, 0.2]]}                             # 4
      # woodland: the litter layer also grows toadstools and rotten stumps (the pack's undergrowth replaces toadstools, MeadowSettings.PackUndergrowthKinds)
      - {name: woodland, tuft: [[tuft, 0.85], [tall_grass, 0.15]], flower: [[daisy, 1.0]], litter: [[leaf, 0.74], [stick, 0.12], [mushroom, 0.10], [stump_small, 0.04]]}  # 5
      - {name: cornflower meadow, tuft: [[tuft, 0.5], [tall_grass, 0.5]], flower: [[cornflower, 0.7], [poppy, 0.2], [daisy, 0.1]]}               # 6
      - {name: yarrow meadow, tuft: [[tall_grass, 0.5], [tuft, 0.5]], flower: [[yarrow, 0.7], [red_clover, 0.2], [daisy, 0.1]]}                  # 7
      - {name: dandelion meadow, tuft: [[tuft, 0.7], [clover, 0.3]], flower: [[dandelion, 0.75], [daisy, 0.15], [buttercup, 0.1]]}               # 8
      # swamp ground (detail.swamp): reeds and tall grass, the odd buttercup, little else
      - {name: swamp, tuft: [[reed, 0.6], [tall_grass, 0.4]], flower: [[buttercup, 1.0]], fern: [[fern, 1.0]], litter: [[leaf, 0.7], [stick, 0.3]], floor: [[moss_mound, 0.7], [branch, 0.3]]}  # 9
    field:
      tuft:   {interior: 0.40, edge: 0.65, tone: 0.5, bare: 0.0}
      flower: {interior: 0.10, tone: 0.25}
      pebble: {interior: 0.04, edge: 0.08, bare: 0.3}
    forest:
      tuft:   {interior: 0.08, tone: 0.15, tree: 0.15, bare: 0.0}
      fern:   {interior: 0.05, tone: 0.1, tree: 0.4}
      pebble: {interior: 0.03, bare: 0.25}
      # Per 100 m2 of plain forest floor (a cell is 4 m2, noise and clump average 1): tuft 6.0, fern 1.9, pebble 1.5, litter 7.5, floor 4.5 = 21.4. Under trees and on
      # litter it is denser (litter 0.6 = 45 per 100 m2 there, as before).
      litter: {interior: 0.10, litter: 0.6, tree: 0.25, tone: 0.2}
      floor:  {interior: 0.09, tree: 0.35, litter: 0.3, tone: 0.12}

# --- Spawn points (props stage, spawns.json) -----------------------------------------------
# Players spawn inside the `player_spawn` zones (`zones` below) and nowhere else: the drawn zones and the rule zone's ground
# areas. No zone on the map: points over the whole terrain, off the roads.
spawns:
  # One point per this many m2 of usable ground (inside the terrain, clear of buildings, trees and water) of a zone, rounded up:
  # every zone with usable ground has points, a bigger one more. No minimum, no maximum.
  m2_per_point: 400
  min_building_distance_m: 12
  min_tree_distance_m: 2
  water_clearance_m: 3  # clear of water bodies (and patches) by this much

# --- Zones (zones.py; props stage for player_spawn, export stage for zone_points.json) -------------------------
# A zone kind is what a marked area means in play (ADR 0022). The kinds are a fixed catalog in code (zones.py KINDS); a kind
# listed here has its numbers, one not listed does nothing. A zone is a polygon drawn of one kind (edits.json `zones`), or a
# rule zone: `where_ground: [ground types]` makes the kind apply wherever a ground area of those types lies, nothing is
# drawn. Both are the same to the export, and a zone never changes the terrain (a zone over a forest does not cut it).
#
# The game never sees ground areas or zones, so for every kind with zones the export stage draws candidate points
# (inside the terrain, clear of buildings and water) and writes them to zone_points.json; the server picks one. Every kind
# but player_spawn and plantation have all of these keys:
#   m2_per_point         one point per this many m2 of usable ground (the zones inside the terrain, minus the clearances),
#   min_points, max_points  but at least min_points and at most max_points. No usable ground: no points.
#   building_clearance_m, water_clearance_m  clear of buildings and of water (and its shore), in metres.
#   where_ground         optional: the rule zone, the ground types the kind applies to.
# player_spawn has no points here: the props stage draws the spawn points inside its zones (spawns above).
# plantation has no points either: the export writes its polygons (zone_polygons.json) and the server asks whether a player
# stands inside one.
zones:
  # The Bigfoot event starts at one of its points. No rule zone: it is drawn only. Clear of buildings (solid for it) and of
  # water; not of trees: it walks through them.
  bigfoot:
    m2_per_point: 1000
    min_points: 30
    max_points: 300
    building_clearance_m: 10
    water_clearance_m: 5
  # The Scud event hides its truck at one of these points (the truck is 12 m long and 3 m wide, so a point wants room: clear of
  # buildings by 15 m and of water by 10 m). No rule zone: it is drawn only (open ground, a field track, a road verge). A map with
  # no scud zone gets a runtime fallback (the server picks open ground away from the players), so drawing one is optional.
  scud:
    m2_per_point: 2000
    min_points: 10
    max_points: 200
    building_clearance_m: 15
    water_clearance_m: 10
  # Players may spawn on open ground: the village and the fields.
  player_spawn:
    where_ground: [allotments, orchard, meadow, village, field]
  # The marijuana plantation: a player on foot inside one who holds the interact key for 1.5 s gets high (godot/shooter/data/plantation.json).
  # Drawn only; no rule zone, no numbers here (the game reads the polygons, not points).
  plantation: {}
  # Wildlife: one point pool per species (the server picks a spawn point for that species from it). The numbers are shared
  # by every species (YAML anchor); the ground types are where the species lives. Species ids: godot/shooter/data/animals.json.
  deer: &wildlife_rule
    m2_per_point: 20000
    min_points: 5
    max_points: 80
    building_clearance_m: 15
    water_clearance_m: 5
    where_ground: [forest, meadow, field]
  doe: {<<: *wildlife_rule, where_ground: [forest, meadow, field]}
  stag: {<<: *wildlife_rule, where_ground: [forest]}
  moose: {<<: *wildlife_rule, where_ground: [forest]}
  boar: {<<: *wildlife_rule, where_ground: [forest]}
  bear: {<<: *wildlife_rule, where_ground: [forest]}
  fox: {<<: *wildlife_rule, where_ground: [dike, forest, meadow, field]}
  wolf: {<<: *wildlife_rule, where_ground: [forest]}
  rabbit: {<<: *wildlife_rule, where_ground: [dike, forest, allotments, orchard, meadow, field]}
  raccoon: {<<: *wildlife_rule, where_ground: [forest, allotments, orchard]}
  skunk: {<<: *wildlife_rule, where_ground: [forest, allotments, orchard]}
  # Flocks of birds (wildlife.json `flocks`): a flock starts at one of these points and flies about from there.
  crow: {<<: *wildlife_rule, where_ground: [forest, meadow, field]}

# --- Street lamps (props stage, data/village/work/lamps.json) ----------------------------------------
# OSM street_lamp nodes are kept where they stand. Where a road has no lamp nearby, rule lamps are
# placed along it every spacing_m, staggered left and right, just beyond the carriageway edge.
# Every lamp must lie in the terrain coverage, outside building footprints (grown by
# building_clearance_m) and outside parcels of avoid_kinds (house plots and gardens). OSM lamps
# only get the coverage and building checks, since their position is taken as given.
lamps:
  # false: no street lamps at all (OSM ones included); the poles and lamps of the edits are placed objects, not these.
  enabled: false
  spacing_m: 30
  # Gap between the carriageway edge and the lamp pole, metres.
  road_offset_m: 1.0
  building_clearance_m: 2
  # A rule lamp is skipped when an OSM lamp (or another rule lamp) is closer than this.
  min_lamp_distance_m: 10
  rule_highways: [primary, secondary, tertiary, unclassified, residential, living_street, service]
  avoid_kinds: [building_plot, garden]

# --- Satellite dishes (python -m drycastle_pipeline.dishes, into config/edits.json as placed objects) ----------
# A seeded share of the dwellings (not the hand-modelled landmarks) gets a dish on the wall that faces the nearest road,
# under the eave, clear of the known openings (config/buildings/*.yaml) and of a house connector. See docs/pipeline.md.
dishes:
  # Chance per dwelling, rolled from a generator seeded with "<building id>:dish": the same houses on every run.
  dish_chance: 0.8
  # No dish on a house whose eave is lower than this (the dish would not fit under it).
  min_eave_m: 2.6
  # The dish's origin hangs this far under the eave (a seeded value in the range) and never lower than min_height_m above the ground.
  drop_m: [0.6, 0.9]
  min_height_m: 2.0
  # The dish keeps this far from the corners of its wall (measured to its centre), and this far (along the wall) from a connector.
  wall_end_m: 0.8
  connector_clear_m: 0.9
  # A dish within this distance of a footprint belongs to that house (so a dragged dish still counts), and a house further than
  # this from every road gets none.
  owned_m: 1.5
  road_max_m: 60
