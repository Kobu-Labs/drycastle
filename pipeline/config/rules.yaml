# Parcel kind and building rules for the base map.
#
# Read by the `parcels` stage (parcel kinds, chunking) and the `rules` stage (`buildings` section
# at the end). Changing a value and re-running the pipeline regenerates the map.

# --- Parcel registry matching ---------------------------------------------------------------
registry:
  # A registry entry whose cadastral reference vanished is matched to an unmatched current
  # parcel when the intersection-over-union of their outlines is at least this (0..1).
  min_iou: 0.5

# --- Building assignment --------------------------------------------------------------------
# Each OSM building goes to the parcel it overlaps most (straddling buildings included).
building_assignment:
  # A building overlapping no parcel goes to the nearest parcel closer than this many metres,
  # otherwise it is listed as unassigned.
  max_distance_m: 10

# --- Road parcel fit (parcels stage, parcel_fit.py) ----------------------------------------
# The cadastre's road parcels are offset from the carriageway and ragged along its edges. A rule turns the listed parcels
# into a strip of constant width along the named OSM ways (half_width_m each side of the centre line, flat ends). The
# ground a parcel gives up goes to the neighbours, the ground it takes comes out of them: no holes, no overlaps.
parcel_fit:
  rules:
    # the main road into the village from the north (w4987914, continued by w1198894774): 6 m, the width of the ribbon
    - {parcels: [P-1019, P-1060], ways: [w4987914, w1198894774], half_width_m: 3.0}

# --- Parcel kind ----------------------------------------------------------------------------
# kind is one of: building_plot, road, forest, field, water, garden, other.
# Rules are tried in this order, the first that matches wins:
#   1. building_plot  the parcel has at least one assigned building
#   2. road           the parcel is covered by a road centreline buffer (see `road`)
#   3. water/forest/field  OSM landuse/natural polygons cover the parcel (see `landuse`)
#   4. garden         small parcel in built-up area without a building (see `garden`)
#   5. other          everything else
parcel_kind:
  road:
    # OSM highway values counted as roads (footways, paths and tracks are not).
    highways: [motorway, trunk, primary, secondary, tertiary, unclassified, residential, living_street, service]
    # Total width of the buffer drawn around each centreline, in metres.
    buffer_width_m: 8
    # Fraction of the parcel area (0..1) that must lie inside the buffer to be a road.
    min_covered_ratio: 0.3
  landuse:
    # A parcel gets the kind of the OSM polygon that covers at least this fraction of it.
    min_cover_ratio: 0.5
    # OSM landuse=<value> -> kind (values not listed are ignored; residential is built-up).
    landuse:
      forest: forest
      farmland: field
      meadow: field
      grass: field
      orchard: field
      vineyard: field
    # OSM natural=<value> -> kind.
    natural:
      water: water
      wood: forest
  garden:
    # Parcels up to this area (square metres) ...
    max_area_m2: 1500
    # ... that lie in built-up area: covered at least min_cover_ratio by one of these OSM
    # landuse values, or within builtup_distance_m metres of any building.
    builtup_landuse: [residential]
    builtup_distance_m: 30

# --- Chunking -------------------------------------------------------------------------------
chunking:
  # Edge of a square chunk in metres, on a grid anchored at the local origin (slice centre).
  # A parcel belongs to the chunk containing its anchor point.
  size_m: 250

# --- Buildings (rules stage) ----------------------------------------------------------------
# One entry per building in data/work/buildings.json. Order of precedence for every value:
#   1. pipeline/config/overrides.yaml (see there)
#   2. OSM tags: height, building:levels, roof:shape, roof:levels
#   3. `types`: class chosen by the OSM building=<value> tag
#   4. `areas`: class chosen by footprint area (first entry whose max_area_m2 >= area)
# Everything else (jitter, hipped-or-gabled, colours) comes from a random generator seeded with
# sha256(parcel id + ":" + building id), so the same input always gives the same map.
buildings:
  # building:levels -> height. height_m is to the top of the roof (as in OSM), the eave
  # (wall top) is height_m minus the roof rise.
  metres_per_level: 3.0
  # roof:levels -> roof rise, per roof level.
  metres_per_roof_level: 1.5
  # Walls never get lower than this; a pitched roof is flattened to fit.
  min_eave_height_m: 2.4
  # Pitched roofs rise at most this much; a rise below min_roof_rise_m becomes a flat roof.
  max_roof_rise_m: 5.0
  min_roof_rise_m: 0.5
  # A pitched roof needs the footprint to fill at least this fraction of its minimum rotated
  # rectangle (the ridge runs along the rectangle's longest side). L- and U-shapes get a flat roof.
  min_roof_fill: 0.8
  # Heights from classes get a random offset in +-height_jitter_m (rounded to 0.1 m).
  height_jitter_m: 0.6
  # OSM roof:shape -> our roof type (flat, gabled, hipped). Unlisted shapes are ignored.
  roof_shapes:
    flat: flat
    skillion: flat   # mono-pitch is not modelled
    gabled: gabled
    gable: gabled
    hipped: hipped
    half-hipped: hipped
    pyramidal: hipped
  # Class fields: height_m (to the roof top), roof (flat | gabled | hipped, or a mapping of
  # type -> weight, e.g. {gabled: 3, hipped: 1}), pitch_deg (pitched roofs; default 30).
  types:
    shed: {height_m: 3.0, roof: flat}
    hut: {height_m: 3.0, roof: flat}
    carport: {height_m: 3.0, roof: flat}
    garage: {height_m: 3.2, roof: flat}
    garages: {height_m: 3.2, roof: flat}
    roof: {height_m: 3.5, roof: flat}
    barn: {height_m: 8.0, roof: gabled, pitch_deg: 20}
    farm_auxiliary: {height_m: 6.0, roof: gabled, pitch_deg: 20}
    stable: {height_m: 5.5, roof: gabled, pitch_deg: 20}
    industrial: {height_m: 8.0, roof: flat}
    warehouse: {height_m: 8.0, roof: flat}
    commercial: {height_m: 7.0, roof: flat}
    retail: {height_m: 6.5, roof: flat}
    apartments: {height_m: 12.0, roof: flat}
    church: {height_m: 11.0, roof: gabled, pitch_deg: 35}
    chapel: {height_m: 7.0, roof: gabled, pitch_deg: 35}
  # Fallback classes by footprint area in m2, checked top to bottom; the last has no limit.
  areas:
    - {name: tiny, max_area_m2: 25, height_m: 3.0, roof: flat}
    - {name: small, max_area_m2: 60, height_m: 4.5, roof: gabled}
    - {name: house, max_area_m2: 300, height_m: 6.5, roof: {gabled: 3, hipped: 1}}
    - {name: large, height_m: 8.0, roof: gabled, pitch_deg: 15}
  # Flat colours as #rrggbb. Wall and roof are picked from these lists by the seeded generator.
  # Muted warm walls; red/brown/grey roofs. Flat roofs use the `flat` list.
  colours:
    walls: ["#e8dcc0", "#d9c7a0", "#cfb48c", "#e6cfc0", "#d8c0b0", "#ece4d0", "#c9b8a0", "#dcd2b8"]
    roofs: ["#a8442f", "#b5523a", "#8c3a2a", "#7a4a35", "#6b5a4c", "#5e5e63", "#7c7f86"]
    flat_roofs: ["#6a6a6e", "#7c7f86", "#8a8478", "#5c5f66"]

# --- Terrain (terrain stage) ----------------------------------------------------------------
# data/raw/dmr5.tif (DMR 5.0, EPSG:3046) is resampled bilinearly into a regular grid in the local
# frame. Chunk edges are grid lines, so neighbouring chunks share their border vertices exactly.
# Terrain exists only where the DMR raster covers: a grid cell is meshed only when all four of
# its corners lie inside the raster (no clamping, no invented ground); chunks without such cells
# get no terrain nodes. Heights for objects outside coverage (e.g. a far building) are clamped to
# the grid edge.
terrain:
  # Wanted grid step in metres. Each chunk is divided into an even number of cells, so the real
  # step is chunk size / round_to_even(chunk size / grid_step_m) (4.03 m for 4 m and 250 m chunks).
  grid_step_m: 4
  # Ground is flattened to the mean elevation of a building footprint: every cell touching the
  # footprint grown by this margin is made flat ...
  flatten_margin_m: 2
  # ... and the terrain blends back to the natural height over this many metres around it.
  flatten_blend_m: 6
  # The collision mesh uses every n-th grid vertex (coarser, uniform colour). Must be 1 or 2.
  collision_decimate: 2
  # Flat face colours by the parcel kind under the face centre. A list is a set of shades; one
  # is picked per parcel (seeded by the parcel ID), so parcels read as patches.
  colours:
    building_plot: ["#c9b78f", "#c2b088"]
    garden: ["#8fbf6a", "#83b562", "#9bc673", "#8ab868"]
    field: ["#6f9a69", "#78a272", "#68925f", "#7fa878"]
    forest: ["#2f5f38", "#2a5633", "#356a3c"]
    water: ["#6b7a6a", "#62725f"]
    # road parcels are grass underneath: the asphalt is the OSM ribbon on top, and a grey base would show as a spill where a
    # 4 m terrain face centred in the narrow road parcel reaches over the edge (same shades as the road grass, detail.road)
    road: ["#86b362", "#7aa858"]
    other: ["#72996b", "#7aa072", "#6a9163"]

# --- Regions (export, region-run) ---------------------------------------------------------
regions:
  # Regions (hand-drawn colour shapes, edits.json) float this far above the terrain surface ...
  lift_m: 0.03
  # ... and this far above a road ribbon where they cover one (so they never z-fight with it).
  road_lift_m: 0.02

# --- Roads (roads stage) --------------------------------------------------------------------
# Ribbons from OSM highways in normalised/highways.geojson, draped on the terrain. Overlapping
# ribbons at junctions are accepted in v1 (a higher road class is lifted a hair above lower ones
# to avoid z-fighting). roads.json: nodes are way ends and shared vertices, edges run between them.
roads:
  # Ribbon sample spacing along a way, in metres (the ribbon follows the terrain at this step).
  sample_step_m: 2
  # Ribbons float this far above the terrain surface.
  lift_m: 0.05
  # Width in metres by highway value (an OSM `width` tag wins, then lanes * lane_width_m).
  # Highway values not listed are not built.
  lane_width_m: 3.0
  widths:
    motorway: 10
    trunk: 9
    primary: 8
    secondary: 7
    tertiary: 6
    unclassified: 5
    residential: 5
    living_street: 4.5
    service: 3.5
    track: 3
    path: 1.5
    footway: 1.5
    cycleway: 2
    pedestrian: 3
  # Draw order of classes (later = lifted slightly higher at overlaps).
  order: [path, footway, cycleway, pedestrian, track, service, living_street, residential, unclassified, tertiary, secondary, primary, trunk, motorway]
  # OSM surface values that count as unpaved (gravel colour); any other tagged surface is paved.
  # Without a surface tag: the classes in unpaved_by_default are unpaved, the rest paved.
  unpaved_surfaces: [unpaved, gravel, fine_gravel, compacted, ground, dirt, earth, grass, sand, mud, pebblestone]
  unpaved_by_default: [track, path]
  colours:
    asphalt: "#8a8c90"
    gravel: "#a89c84"
    path: "#9a8a6c"

# --- Props: fences and trees (props stage) --------------------------------------------------
# Everything is seeded from sha256(parcel id + ":" + purpose), so reruns give identical props.
props:
  fences:
    # Parcels of these kinds get a fence on their boundary. A garden counts only when a building
    # is within garden_near_building_m.
    kinds: [building_plot, garden]
    garden_near_building_m: 25
    # Fraction of eligible parcels that get a fence (seeded per parcel).
    probability: 0.75
    height_m: 1.2
    thickness_m: 0.08
    # A fence is built from boxes of at most this length.
    section_m: 3
    colour: "#8a6a47"
    # Optional `type` (picket, wire, brick_red, brick_white, stone_wall, concrete; see edits.py
    # FENCE_TYPES) draws the rule fences in that textured style instead of the plain box, and an
    # optional `column` swaps its posts (edits.py COLUMN_TYPES). `colour` is then the tint. Each
    # fenced parcel gets one more node per texture, so mind the draw calls in the village.
    # type: picket
    # Boundary stretches within this distance of a building are not fenced.
    building_clearance_m: 0.8
    # Boundary stretches within this distance of a road centreline are not fenced.
    road_clearance_m: 0.5
    # Boundary stretches shared with a road parcel get a gap of this length for a gate (0 = no
    # gap), centred on the middle of the longest such stretch. Stretches already fenced for
    # another parcel (shared boundary) are not fenced twice.
    gate_gap_m: 3
    # Emit fence collision boxes (props_collision node). They are about half of all triangles of a
    # chunk file; turn off where fences need not stop players (the village profile does).
    collision: true
  trees:
    # Trees per 1000 m2 of parcel area, by kind (random placement, min spacing, seeded).
    density_per_1000m2: {garden: 1.5, building_plot: 0.8, forest: 8.0, field: 0.0, other: 0.3}
    # Cap on rule-based trees per chunk (0 = no cap); OSM trees always stay. Surplus trees are
    # dropped by a position hash, so the result is stable and spread over the chunk.
    max_per_chunk: 0
    min_spacing_m: 3.5
    building_clearance_m: 3.5
    road_clearance_m: 2.0
    parcel_edge_clearance_m: 1.0
    # Rule-based trees keep this far from placed objects (objects.json, see config/edits.json).
    object_clearance_m: 1.0
    # Rows of trees along the edge of water regions (edits.json regions with water_y): offset from the
    # shoreline and the share of positions kept per row (thinner outwards), positions this far apart.
    shore:
      spacing_m: 4.0
      rows:
        - {offset_m: 2.0, keep: 1.0}
        - {offset_m: 5.5, keep: 0.7}
        - {offset_m: 9.0, keep: 0.4}
    # Tree size: trunk height and canopy edge in metres, scaled by a seeded factor in [0.8, 1.25].
    trunk_height_m: 1.8
    trunk_width_m: 0.35
    canopy_m: 2.6
    trunk_colour: "#6b4a2f"
    canopy_colours: ["#4f8f45", "#5a9a4c", "#468040"]
    forest_canopy_colours: ["#2f6a3a", "#285e33"]

# --- Ground detail (detail stage, `make detail`; docs/pipeline.md "Detail") ----------------------------
# Patches (flat colour or library texture, draped on the terrain, never overlapping: the first layer in
# detail.PATCH_PRIORITY wins) and clutter instances (kind, x, y, z, rot, scale; drawn by the game as instanced
# meshes near the player only) for every parcel except water. detail.area_type() maps a parcel to a recipe
# (garden, field, forest, road); the sections below are the recipes' numbers. Everything is seeded per parcel
# (sha256 of "<parcel>:detail:<purpose>"), so reruns give identical output.
# Budgets (village): patch triangles under ~150k in all, clutter.json under ~6 MB (about 150k instances).
detail:
  # Patches float this far above the terrain; hand-drawn regions (regions.lift_m, 0.03) are cut out of them.
  lift_m: 0.02
  # Parts of a parcel (clipped to the terrain coverage) smaller than this get no detail.
  min_parcel_m2: 4
  wall_clearance_m: 0.12
  fence_clearance_m: 0.08
  trunk_radius_m: 0.3
  road_clearance_m: 0.15
  # Placed objects (objects.json) keep detail off a circle of half their footprint diagonal plus this.
  object_clearance_m: 0.3
  # Flood dike (recipe "dike", detail.py + dike.py): these parcels are the dike whatever their kind. The carriageway of the road
  # edges inside them is covered by a gravel track (texture dike_gravel: fine gravel, grass patches) a little wider than the
  # road with a wandering edge, the rest is flat grass with thick grass as clutter: tall grass and tufts, taller and a bit
  # sparser the further from the track (the dike's sides), tufts on the grass patches of the track.
  dike:
    parcels: ["P-0073", "P-0821", "P-0805"]
    # Parcels of which only a part is the dike (the rest keeps its own recipe): the ground within within_m of a road way.
    clips:
      P-1057: {osm_id: w825140517, within_m: 12}
    track_extra_m: 0.2       # the track is at least this much wider than the road (it must hide the road's flat colour)
    track_wobble_m: 0.7      # how far the edge of the track wanders out beyond that, each side (waves of 1.4 to 16 m)
    track_lift_m: 0.08       # above the terrain: over the road ribbon (roads.lift_m 0.05 plus 3 mm per class rank) so the texture shows
    spill:                   # loose pebbles beyond the edge of the track: blobs every spacing_m (varied), radius, how far out
      {spacing_m: 0.9, radius_m: [0.1, 0.38], reach_m: 0.45}
    piece_m: 8.0             # the texture is laid in pieces of this length, each along its own direction and start
    lawn_colours: ["#86b362", "#7aa858", "#6e9c50"]
    grass:
      spacing_m: 0.95
      scale: [0.95, 1.4]
      kinds: [[tall_grass, 0.55], [tuft, 0.33], [straw, 0.12]]
      reach_m: 9.0           # the distance from the track at which the scale has grown by reach_scale
      reach_scale: 0.6
    patch_tuft: {spacing_m: 0.3, keep: 0.5, scale: [0.7, 1.1]}
  # Hard cap of instances per chunk and kind (0 = none); surplus ones are dropped by a position hash. (Kinds the yards and verges
  # grow: the tall and the flower kinds have their own caps; the meadow's kinds are generated by the game, not stored.)
  caps_per_chunk: {tuft: 5000, flower: 700, pebble: 4000, rock: 300, leaf: 2500, stick: 700, fern: 900, tall_grass: 2500, clover: 1500, straw: 1500, reed: 600, weed: 800, dandelion: 300, daisy: 300, red_clover: 300, buttercup: 300, poppy: 300, cornflower: 300, yarrow: 300, tulip: 400, sunflower: 200, spike: 300, rose: 200}
  # Gravel and dirt blobs along the carriageway edge of these highways (every parcel they reach gets them).
  verge:
    highways: [residential, tertiary, service, track]
    keep: 0.2
    step_m: [3.0, 6.0]
    offset_m: [0.1, 0.7]
    radius_m: [0.4, 0.9]
    stretch: [1.6, 2.8]
    vertices: 8
    gravel_share: 0.55
  lawn:
    # A lawn colour is the fixed one at terrain_mix 0 and the parcel's terrain colour times its shade at 1.
    # A tan plot (mix 0.25) gets drawn green lawn pieces; a green garden (mix 1) only tones of its own green.
    colours: ["#8fbf6a", "#83b562", "#9bc673"]
    shades: [0.97, 1.0, 1.04]
    tone_colours: ["#a6d27f", "#76a856"]
    tone_shades: [1.12, 0.86]
    terrain_mix: {garden: 1.0, building_plot: 0.25}
    # Lawn pieces (only where the lawn is drawn): blobs on a spacing, the share kept sets how green the plot is.
    blob_spacing_m: 5.0
    blob_radius_m: [2.5, 4.5]
    keep: 0.5
    tone_spacing_m: 8.0
    tone_radius_m: [1.6, 3.2]
    tone_keep: 0.12
  dirt:
    # Splash and wear along walls: a blob every ~wall_spacing_m along a building outline.
    wall_spacing_m: 4.0
    wall_keep: 0.2
    wall_radius_m: [0.4, 0.8]
    # Worn bare patches in the open yard, per 1000 m2.
    open_per_1000m2: 2
    open_radius_m: [0.5, 1.0]
    blob_vertices: 8
  gravel:
    # A path from the gate (the middle of the longest unfenced stretch of the boundary within frontage_m of
    # the carriageway, at least min_gate_m long) to the nearest building; none without a gate or a building.
    width_m: [1.0, 1.5]
    wobble_m: 1.0
    min_length_m: 2.5
    max_length_m: 25
    frontage_m: 4.0
    min_gate_m: 1.5
  beds:
    per_1000m2: 2.0
    max: 2
    size_m: [3.2, 1.7]
    rim_m: 0.4
    building_distance_m: 2.5
    fence_distance_m: 1.0
  litter:
    # Leaf litter under a tree: blobs of canopy_m * scale * radius_factor around the trunk.
    radius_factor: 0.7
    blobs_per_tree: 1
  # Tint of the grasses and ferns (the byte after the scale in clutter.json; 128 = as drawn, lower = fresher, higher = drier).
  # The base is a smooth noise over the ground (meadow.py), so a stretch of grass has one mood; these shift it in tint units:
  # grass within fresh_m of a fence or a wall stands unmown and fresh, grass within water_m of water likewise.
  tint:
    fence_fresh: -40
    fresh_m: 1.5
    water_fresh: -45
    water_m: 6.0
  # Garden and plot clutter. spacing_m: grid of candidates (one per cell, jittered); the other numbers are the
  # share of candidates kept by place.
  clutter:
    # Grass within unmown_m of a fence or wall (nobody mows there) is tall_grass with probability `tall`, the rest of the lawn is
    # clover with probability `clover`, else tuft. clump / clump_m: growth in clumps with gaps (see detail.meadow).
    tuft:   {spacing_m: 0.7,  lawn: 0.09, edge: 0.5,  edge_m: 1.0, clump: 0.7, clump_m: 5.0, unmown_m: 0.9, tall: 0.75, clover: 0.18, scale: [0.8, 1.3]}
    # Flowers of a yard are garden flowers (the wild ones stay on meadows and verges): a cluster is one species, picked by share,
    # of `size` plants within cluster_radius_m.
    flower:
      cluster_spacing_m: 6.0
      cluster_keep: 0.25
      cluster_radius_m: 0.5
      scale: [0.8, 1.2]
      species:
        tulip:     {share: 0.40, size: [3, 6]}
        spike:     {share: 0.25, size: [2, 4]}
        sunflower: {share: 0.20, size: [1, 3]}
        rose:      {share: 0.15, size: [1, 2]}
    pebble: {spacing_m: 0.35, gravel: 0.35, dirt: 0.1, wall: 0.2, wall_m: 0.7, scale: [0.6, 1.4]}
    rock:   {spacing_m: 3.0,  dirt: 0.25, lawn: 0.04, edge: 0.12, edge_m: 1.5, scale: [0.6, 1.5]}
    leaf:   {spacing_m: 0.45, litter: 0.3, tree_lawn: 0.1, tree_reach_m: 1.6, scale: [0.8, 1.2]}
    stick:  {spacing_m: 1.0,  litter: 0.25, scale: [0.7, 1.3]}
  # Meadow and field (parcel kind other).
  field:
    tone_colours: ["#b7aa6c", "#7fa56d"]
    tone_shades: [1.14, 0.88]
    terrain_mix: {other: 0.45}
    tone_per_ha: 3
    tone_radius_m: [3.0, 8.0]
    # Within edge_band_m of the boundary clutter is denser, and dirt headland blobs lie along it.
    edge_band_m: 4.0
    headland: {spacing_m: 12.0, keep: 0.15, radius_m: [1.0, 2.2], stretch: 2.2, vertices: 10}
    # A strip of furrows (soil_rows texture) in a share of the larger parcels.
    furrow: {probability: 0.06, min_area_m2: 2500, coverage: [0.3, 0.5], min_piece_m2: 200, max_area_m2: 4000}
    clutter:
      tuft:   {spacing_m: 1.0, edge: 0.2, dirt: 0.08, tone: 0.1, interior: 0.012, scale: [0.8, 1.4]}
      pebble: {spacing_m: 0.5, dirt: 0.1, edge: 0.005, scale: [0.6, 1.4]}
      rock:   {spacing_m: 4.0, edge: 0.06, dirt: 0.2, interior: 0.004, scale: [0.6, 1.6]}
      flower: {spacing_m: 2.0, tone: 0.08, interior: 0.012, scale: [0.8, 1.2]}
  forest:
    tone_colours: ["#3f7444", "#26512f"]
    tone_shades: [1.25, 0.75]
    tone_per_ha: 4
    tone_radius_m: [2.5, 6.0]
    litter: {radius_factor: 0.5, blobs_per_tree: 1, keep: 0.22}
    dirt: {per_ha: 3, radius_m: [0.6, 1.4]}
    clutter:
      leaf:   {spacing_m: 0.8, litter: 0.1, tone: 0.01, interior: 0.003, scale: [0.8, 1.2]}
      stick:  {spacing_m: 1.5, litter: 0.06, tone: 0.01, interior: 0.004, scale: [0.7, 1.3]}
      rock:   {spacing_m: 5.0, dirt: 0.2, interior: 0.02, scale: [0.6, 1.6]}
      pebble: {spacing_m: 0.7, dirt: 0.2, scale: [0.6, 1.4]}
      tuft:   {spacing_m: 1.5, tone: 0.1, interior: 0.06, scale: [0.8, 1.3]}
      fern:   {per_tree: 0.45, group_max: 3, ring_m: [0.5, 1.8], scale: [0.8, 1.3]}
  # Road land (parcel kind road): grass on all of the parcel beside the carriageway (OSM roads are the only paved ground).
  road:
    grass_colours: ["#86b362", "#7aa858"]
    clutter:
      tuft:   {spacing_m: 0.6, grass: 0.3, dirt: 0.15, scale: [0.8, 1.3], kinds: [[tuft, 0.7], [tall_grass, 0.15], [clover, 0.15]]}
      pebble: {spacing_m: 0.4, gravel: 0.35, dirt: 0.1, scale: [0.6, 1.4]}
      rock:   {spacing_m: 4.0, grass: 0.03, scale: [0.6, 1.5]}
      flower: {spacing_m: 1.5, grass: 0.01, scale: [0.8, 1.2], kinds: [[daisy, 0.3], [dandelion, 0.3], [buttercup, 0.2], [red_clover, 0.2]]}
      leaf:   {spacing_m: 1.0, grass: 0.05, scale: [0.8, 1.2]}
  # Meadow: the game generates tufts, flowers, ferns, pebbles, leaves and sticks near the player on fields,
  # meadows and in forests from a coarse density raster (meadow.bin, see meadow.py) instead of stored instances.
  # A cell is cell_m wide; an instance lies within jitter_m of its centre, and a cell is on the raster only where
  # that whole window is free ground. Per layer: max_per_cell is the density at 255 (instances per cell), kinds
  # the clutter meshes and their shares (a species mix may change them), scale the span. Per parcel type and layer, as shares of
  # max_per_cell: interior, edge (within the recipe's edge band), tone (tone patches), litter (leaf litter),
  # tree (within tree_reach_m of a trunk), bare (dirt, gravel; replaces the rest). Smooth noise (noise_m lattice,
  # noise_amp strength) thins and thickens them in patches. The stored clutter of field and forest keeps only
  # the kinds in stored_kinds.
  meadow:
    cell_m: 2.0
    jitter_m: 0.85
    noise_m: 16.0
    noise_amp: 0.6
    tree_reach_m: 3.0
    # The game drops generated instances this close to a tree trunk (scaled by the tree's scale).
    trunk_reach_m: 0.7
    stored_kinds: [rock]
    # Clumps: a smoothed noise of clump_m makes growth patchy (clump 0 = none, 1 = bare gaps between thick clumps; the mean
    # stays near 1). unmown: density factor where nobody mows (within unmown_m of a fence, wall or building edge).
    clump_m: 6.0
    unmown_m: 1.5
    # Species zones (meadow.py, "Zones"): a Voronoi patch of patch_m metres takes one mix (index in `mixes`) from the
    # type's shares in `zones`; beside water (wet_m) the type's wet_mix, where nobody mows its unmown_mix, in half of
    # a field's edge band its edge_dry_mix. Dryness (tint bias, 8 = neutral, 10 tint units a step): dry_edge more in the
    # edge band, fresh_unmown / fresh_water fewer where nobody mows / beside water.
    patch_m: 6.0
    wet_m: 8.0
    fresh_unmown: 3
    fresh_water: 4
    zones:
      field:  {mixes: [[0, 0.28], [1, 0.17], [2, 0.10], [3, 0.10], [6, 0.10], [7, 0.10], [8, 0.15]], unmown_mix: 1, wet_mix: 4, edge_dry_mix: 2, edge_dry_share: 0.5, dry_edge: 4}
      forest: {mixes: [[5, 1.0]]}
    # Per layer: kinds = what it makes and in what shares by default; `mixes` entries list the layers they change.
    layers:
      tuft:   {kinds: [[tuft, 1.0]], max_per_cell: 3.0, scale: [0.8, 1.4], clump: 0.75, unmown: 1.3}
      flower: {kinds: [[flower, 1.0]], max_per_cell: 1.0, scale: [0.8, 1.2], clump: 0.9}
      fern:   {kinds: [[fern, 1.0]], max_per_cell: 1.5, scale: [0.8, 1.3], clump: 0.5}
      pebble: {kinds: [[pebble, 1.0]], max_per_cell: 2.0, scale: [0.6, 1.4]}
      litter: {kinds: [[leaf, 0.8], [stick, 0.2]], max_per_cell: 3.0, scale: [0.8, 1.2], clump: 0.4}
    mixes:
      # Grass profile and the flowers that dominate the patch (one species with strays); ids are what zones.<type>.mixes refer to.
      - {name: meadow, tuft: [[tuft, 0.65], [clover, 0.35]], flower: [[daisy, 0.55], [dandelion, 0.25], [buttercup, 0.2]]}                       # 0
      - {name: tall meadow, tuft: [[tall_grass, 0.8], [tuft, 0.2]], flower: [[red_clover, 0.6], [yarrow, 0.25], [daisy, 0.15]]}                   # 1
      - {name: dry, tuft: [[straw, 0.7], [tall_grass, 0.2], [tuft, 0.1]], flower: [[poppy, 0.6], [cornflower, 0.3], [daisy, 0.1]]}                # 2
      - {name: weedy, tuft: [[weed, 0.5], [tall_grass, 0.3], [tuft, 0.2]], flower: [[dandelion, 0.65], [yarrow, 0.2], [buttercup, 0.15]]}        # 3
      - {name: wet, tuft: [[reed, 0.55], [tall_grass, 0.3], [tuft, 0.15]], flower: [[buttercup, 0.8], [daisy, 0.2]]}                             # 4
      - {name: woodland, tuft: [[tuft, 0.85], [tall_grass, 0.15]], flower: [[daisy, 1.0]]}                                                          # 5
      - {name: cornflower meadow, tuft: [[tuft, 0.5], [tall_grass, 0.5]], flower: [[cornflower, 0.7], [poppy, 0.2], [daisy, 0.1]]}               # 6
      - {name: yarrow meadow, tuft: [[tall_grass, 0.5], [tuft, 0.5]], flower: [[yarrow, 0.7], [red_clover, 0.2], [daisy, 0.1]]}                  # 7
      - {name: dandelion meadow, tuft: [[tuft, 0.7], [clover, 0.3]], flower: [[dandelion, 0.75], [daisy, 0.15], [buttercup, 0.1]]}               # 8
    field:
      tuft:   {interior: 0.40, edge: 0.65, tone: 0.5, bare: 0.0}
      flower: {interior: 0.10, tone: 0.25}
      pebble: {interior: 0.04, edge: 0.08, bare: 0.3}
    forest:
      tuft:   {interior: 0.08, tone: 0.15, tree: 0.15, bare: 0.0}
      fern:   {interior: 0.05, tone: 0.1, tree: 0.4}
      pebble: {interior: 0.03, bare: 0.25}
      litter: {interior: 0.14, litter: 0.6, tree: 0.25, tone: 0.2}

# --- Spawn candidates (props stage, spawns.json) --------------------------------------------
spawns:
  # Number of candidates written (a seeded subset of all valid points).
  count: 60
  # Share of the subset taken from roads, the rest from open ground (garden, field, other).
  road_fraction: 0.4
  min_building_distance_m: 12
  min_tree_distance_m: 2
  # Candidate pool: spacing along roads and per-parcel point density in the open ground.
  road_spacing_m: 12
  ground_per_1000m2: 2.0
  ground_kinds: [garden, field, other]

# --- Street lamps (props stage, data/work/lamps.json) ----------------------------------------
# OSM street_lamp nodes are kept where they stand. Where a road has no lamp nearby, rule lamps are
# placed along it every spacing_m, staggered left and right, just beyond the carriageway edge.
# Every lamp must lie in the terrain coverage, outside building footprints (grown by
# building_clearance_m) and outside parcels of avoid_kinds (house plots and gardens). OSM lamps
# only get the coverage and building checks, since their position is taken as given.
lamps:
  spacing_m: 30
  # Gap between the carriageway edge and the lamp pole, metres.
  road_offset_m: 1.0
  building_clearance_m: 2
  # A rule lamp is skipped when an OSM lamp (or another rule lamp) is closer than this.
  min_lamp_distance_m: 10
  rule_highways: [primary, secondary, tertiary, unclassified, residential, living_street, service]
  avoid_kinds: [building_plot, garden]

# --- Area overlays --------------------------------------------------------------------------
# `areas.<name>.<section>` is merged over the section when the pipeline runs with that area
# (--area / AREA=). The slice has none and keeps the settings above. The village is ~50x larger,
# so it trades prop density for chunk size (all chunks are loaded at startup, 16-64 players,
# weak GPUs): fewer fences without collision, fewer trees, a few more spawn candidates.
areas:
  village:
    props:
      fences:
        probability: 0.5
        section_m: 4
        collision: false
      trees:
        density_per_1000m2: {garden: 1.0, building_plot: 0.5, forest: 4.0, field: 0.0, other: 0.2}
        max_per_chunk: 0
    spawns:
      count: 150
