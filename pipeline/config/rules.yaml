# Parcel kind and building rules for the base map.
#
# Read by the `parcels` stage (parcel kinds, chunking) and the `rules` stage (`buildings` section
# at the end). Changing a value and re-running the pipeline regenerates the map.

# --- Parcel registry matching ---------------------------------------------------------------
registry:
  # A registry entry whose cadastral reference vanished is matched to an unmatched current
  # parcel when the intersection-over-union of their outlines is at least this (0..1).
  min_iou: 0.5

# --- Building assignment --------------------------------------------------------------------
# Each OSM building goes to the parcel it overlaps most (straddling buildings included).
building_assignment:
  # A building overlapping no parcel goes to the nearest parcel closer than this many metres,
  # otherwise it is listed as unassigned.
  max_distance_m: 10

# --- Parcel kind ----------------------------------------------------------------------------
# kind is one of: building_plot, road, forest, field, water, garden, other.
# Rules are tried in this order, the first that matches wins:
#   1. building_plot  the parcel has at least one assigned building
#   2. road           the parcel is covered by a road centreline buffer (see `road`)
#   3. water/forest/field  OSM landuse/natural polygons cover the parcel (see `landuse`)
#   4. garden         small parcel in built-up area without a building (see `garden`)
#   5. other          everything else
parcel_kind:
  road:
    # OSM highway values counted as roads (footways, paths and tracks are not).
    highways: [motorway, trunk, primary, secondary, tertiary, unclassified, residential, living_street, service]
    # Total width of the buffer drawn around each centreline, in metres.
    buffer_width_m: 8
    # Fraction of the parcel area (0..1) that must lie inside the buffer to be a road.
    min_covered_ratio: 0.3
  landuse:
    # A parcel gets the kind of the OSM polygon that covers at least this fraction of it.
    min_cover_ratio: 0.5
    # OSM landuse=<value> -> kind (values not listed are ignored; residential is built-up).
    landuse:
      forest: forest
      farmland: field
      meadow: field
      grass: field
      orchard: field
      vineyard: field
    # OSM natural=<value> -> kind.
    natural:
      water: water
      wood: forest
  garden:
    # Parcels up to this area (square metres) ...
    max_area_m2: 1500
    # ... that lie in built-up area: covered at least min_cover_ratio by one of these OSM
    # landuse values, or within builtup_distance_m metres of any building.
    builtup_landuse: [residential]
    builtup_distance_m: 30

# --- Chunking -------------------------------------------------------------------------------
chunking:
  # Edge of a square chunk in metres, on a grid anchored at the local origin (slice centre).
  # A parcel belongs to the chunk containing its anchor point.
  size_m: 250

# --- Buildings (rules stage) ----------------------------------------------------------------
# One entry per building in data/work/buildings.json. Order of precedence for every value:
#   1. pipeline/config/overrides.yaml (see there)
#   2. OSM tags: height, building:levels, roof:shape, roof:levels
#   3. `types`: class chosen by the OSM building=<value> tag
#   4. `areas`: class chosen by footprint area (first entry whose max_area_m2 >= area)
# Everything else (jitter, hipped-or-gabled, colours) comes from a random generator seeded with
# sha256(parcel id + ":" + building id), so the same input always gives the same map.
buildings:
  # building:levels -> height. height_m is to the top of the roof (as in OSM), the eave
  # (wall top) is height_m minus the roof rise.
  metres_per_level: 3.0
  # roof:levels -> roof rise, per roof level.
  metres_per_roof_level: 1.5
  # Walls never get lower than this; a pitched roof is flattened to fit.
  min_eave_height_m: 2.4
  # Pitched roofs rise at most this much; a rise below min_roof_rise_m becomes a flat roof.
  max_roof_rise_m: 5.0
  min_roof_rise_m: 0.5
  # A pitched roof needs the footprint to fill at least this fraction of its minimum rotated
  # rectangle (the ridge runs along the rectangle's longest side). L- and U-shapes get a flat roof.
  min_roof_fill: 0.8
  # Heights from classes get a random offset in +-height_jitter_m (rounded to 0.1 m).
  height_jitter_m: 0.6
  # OSM roof:shape -> our roof type (flat, gabled, hipped). Unlisted shapes are ignored.
  roof_shapes:
    flat: flat
    skillion: flat   # mono-pitch is not modelled
    gabled: gabled
    gable: gabled
    hipped: hipped
    half-hipped: hipped
    pyramidal: hipped
  # Class fields: height_m (to the roof top), roof (flat | gabled | hipped, or a mapping of
  # type -> weight, e.g. {gabled: 3, hipped: 1}), pitch_deg (pitched roofs; default 30).
  types:
    shed: {height_m: 3.0, roof: flat}
    hut: {height_m: 3.0, roof: flat}
    carport: {height_m: 3.0, roof: flat}
    garage: {height_m: 3.2, roof: flat}
    garages: {height_m: 3.2, roof: flat}
    roof: {height_m: 3.5, roof: flat}
    barn: {height_m: 8.0, roof: gabled, pitch_deg: 20}
    farm_auxiliary: {height_m: 6.0, roof: gabled, pitch_deg: 20}
    stable: {height_m: 5.5, roof: gabled, pitch_deg: 20}
    industrial: {height_m: 8.0, roof: flat}
    warehouse: {height_m: 8.0, roof: flat}
    commercial: {height_m: 7.0, roof: flat}
    retail: {height_m: 6.5, roof: flat}
    apartments: {height_m: 12.0, roof: flat}
    church: {height_m: 11.0, roof: gabled, pitch_deg: 35}
    chapel: {height_m: 7.0, roof: gabled, pitch_deg: 35}
  # Fallback classes by footprint area in m2, checked top to bottom; the last has no limit.
  areas:
    - {name: tiny, max_area_m2: 25, height_m: 3.0, roof: flat}
    - {name: small, max_area_m2: 60, height_m: 4.5, roof: gabled}
    - {name: house, max_area_m2: 300, height_m: 6.5, roof: {gabled: 3, hipped: 1}}
    - {name: large, height_m: 8.0, roof: gabled, pitch_deg: 15}
  # Flat colours as #rrggbb. Wall and roof are picked from these lists by the seeded generator.
  # Muted warm walls; red/brown/grey roofs. Flat roofs use the `flat` list.
  colours:
    walls: ["#e8dcc0", "#d9c7a0", "#cfb48c", "#e6cfc0", "#d8c0b0", "#ece4d0", "#c9b8a0", "#dcd2b8"]
    roofs: ["#a8442f", "#b5523a", "#8c3a2a", "#7a4a35", "#6b5a4c", "#5e5e63", "#7c7f86"]
    flat_roofs: ["#6a6a6e", "#7c7f86", "#8a8478", "#5c5f66"]

# --- Terrain (terrain stage) ----------------------------------------------------------------
# data/raw/dmr5.tif (DMR 5.0, EPSG:3046) is resampled bilinearly into a regular grid in the local
# frame. Chunk edges are grid lines, so neighbouring chunks share their border vertices exactly.
# Terrain exists only where the DMR raster covers: a grid cell is meshed only when all four of
# its corners lie inside the raster (no clamping, no invented ground); chunks without such cells
# get no terrain nodes. Heights for objects outside coverage (e.g. a far building) are clamped to
# the grid edge.
terrain:
  # Wanted grid step in metres. Each chunk is divided into an even number of cells, so the real
  # step is chunk size / round_to_even(chunk size / grid_step_m) (4.03 m for 4 m and 250 m chunks).
  grid_step_m: 4
  # Ground is flattened to the mean elevation of a building footprint: every cell touching the
  # footprint grown by this margin is made flat ...
  flatten_margin_m: 2
  # ... and the terrain blends back to the natural height over this many metres around it.
  flatten_blend_m: 6
  # The collision mesh uses every n-th grid vertex (coarser, uniform colour). Must be 1 or 2.
  collision_decimate: 2
  # Flat face colours by the parcel kind under the face centre. A list is a set of shades; one
  # is picked per parcel (seeded by the parcel ID), so parcels read as patches.
  colours:
    building_plot: ["#c9b78f", "#c2b088"]
    garden: ["#8fbf6a", "#83b562", "#9bc673", "#8ab868"]
    field: ["#b9cf72", "#c6d783", "#a9c463", "#d1d88f"]
    forest: ["#3f7a45", "#386f3f"]
    water: ["#6fa3d4"]
    road: ["#8e8e8e"]
    other: ["#b8b0a2", "#c0b8aa"]

# --- Roads (roads stage) --------------------------------------------------------------------
# Ribbons from OSM highways in normalised/highways.geojson, draped on the terrain. Overlapping
# ribbons at junctions are accepted in v1 (a higher road class is lifted a hair above lower ones
# to avoid z-fighting). roads.json: nodes are way ends and shared vertices, edges run between them.
roads:
  # Ribbon sample spacing along a way, in metres (the ribbon follows the terrain at this step).
  sample_step_m: 2
  # Ribbons float this far above the terrain surface.
  lift_m: 0.05
  # Width in metres by highway value (an OSM `width` tag wins, then lanes * lane_width_m).
  # Highway values not listed are not built.
  lane_width_m: 3.0
  widths:
    motorway: 10
    trunk: 9
    primary: 8
    secondary: 7
    tertiary: 6
    unclassified: 5
    residential: 5
    living_street: 4.5
    service: 3.5
    track: 3
    path: 1.5
    footway: 1.5
    cycleway: 2
    pedestrian: 3
  # Draw order of classes (later = lifted slightly higher at overlaps).
  order: [path, footway, cycleway, pedestrian, track, service, living_street, residential, unclassified, tertiary, secondary, primary, trunk, motorway]
  # OSM surface values that count as unpaved (gravel colour); any other tagged surface is paved.
  # Without a surface tag: the classes in unpaved_by_default are unpaved, the rest paved.
  unpaved_surfaces: [unpaved, gravel, fine_gravel, compacted, ground, dirt, earth, grass, sand, mud, pebblestone]
  unpaved_by_default: [track, path]
  colours:
    asphalt: "#4a4c52"
    gravel: "#a89c84"
    path: "#9a8a6c"

# --- Props: fences and trees (props stage) --------------------------------------------------
# Everything is seeded from sha256(parcel id + ":" + purpose), so reruns give identical props.
props:
  fences:
    # Parcels of these kinds get a fence on their boundary. A garden counts only when a building
    # is within garden_near_building_m.
    kinds: [building_plot, garden]
    garden_near_building_m: 25
    # Fraction of eligible parcels that get a fence (seeded per parcel).
    probability: 0.75
    height_m: 1.2
    thickness_m: 0.08
    # A fence is built from boxes of at most this length.
    section_m: 3
    colour: "#8a6a47"
    # Boundary stretches within this distance of a building are not fenced.
    building_clearance_m: 0.8
    # Boundary stretches within this distance of a road centreline are not fenced.
    road_clearance_m: 0.5
    # Boundary stretches shared with a road parcel get a gap of this length for a gate (0 = no
    # gap), centred on the middle of the longest such stretch. Stretches already fenced for
    # another parcel (shared boundary) are not fenced twice.
    gate_gap_m: 3
    # Emit fence collision boxes (props_collision node). They are about half of all triangles of a
    # chunk file; turn off where fences need not stop players (the village profile does).
    collision: true
  trees:
    # Trees per 1000 m2 of parcel area, by kind (random placement, min spacing, seeded).
    density_per_1000m2: {garden: 1.5, building_plot: 0.8, forest: 8.0, field: 0.0, other: 0.3}
    max_per_parcel: 120
    # Cap on rule-based trees per chunk (0 = no cap); OSM trees always stay. Surplus trees are
    # dropped by a position hash, so the result is stable and spread over the chunk.
    max_per_chunk: 0
    min_spacing_m: 3.5
    building_clearance_m: 3.5
    road_clearance_m: 2.0
    parcel_edge_clearance_m: 1.0
    # Rule-based trees keep this far from placed objects (objects.json, see config/edits.json).
    object_clearance_m: 1.0
    # Tree size: trunk height and canopy edge in metres, scaled by a seeded factor in [0.8, 1.25].
    trunk_height_m: 1.8
    trunk_width_m: 0.35
    canopy_m: 2.6
    trunk_colour: "#6b4a2f"
    canopy_colours: ["#4f8f45", "#5a9a4c", "#468040"]
    forest_canopy_colours: ["#2f6a3a", "#285e33"]

# --- Spawn candidates (props stage, spawns.json) --------------------------------------------
spawns:
  # Number of candidates written (a seeded subset of all valid points).
  count: 60
  # Share of the subset taken from roads, the rest from open ground (garden, field, other).
  road_fraction: 0.4
  min_building_distance_m: 12
  min_tree_distance_m: 2
  # Candidate pool: spacing along roads and per-parcel point density in the open ground.
  road_spacing_m: 12
  ground_per_1000m2: 2.0
  ground_kinds: [garden, field, other]

# --- Area overlays --------------------------------------------------------------------------
# `areas.<name>.<section>` is merged over the section when the pipeline runs with that area
# (--area / AREA=). The slice has none and keeps the settings above. The village is ~50x larger,
# so it trades prop density for chunk size (all chunks are loaded at startup, 16-64 players,
# weak GPUs): fewer fences without collision, fewer trees, a few more spawn candidates.
areas:
  village:
    props:
      fences:
        probability: 0.5
        section_m: 4
        collision: false
      trees:
        density_per_1000m2: {garden: 1.0, building_plot: 0.5, forest: 4.0, field: 0.0, other: 0.2}
        max_per_chunk: 150
    spawns:
      count: 150
