# Per-tree overrides of the planted trees (the orthophoto detector plants every tree: docs/ortho.md, docs/pipeline.md).
#
# One key, `remove`: trees to leave out. Each entry clears every tree whose trunk stands within `radius` metres of `at`,
# whether the detector found it alone or the canopy planting placed it. The other trees do not move (the planting runs as
# before and the matches are dropped afterwards). A `make map-update` applies a change.
#   at      [x, y] in absolute EPSG:5514 metres (as a sketch point or a gate: survives a change of the map's frame origin)
#   radius  metres, default 1, at most 50
#   note    free text
# An entry that matches no tree is reported as a warning by the props stage.
remove:
  # The mechanic garage (ticket #320, godot/ShooterCore/MechanicGarage.cs): two detected trees stand on its footprint.
  - at: [-589023.306, -1250160.726]
    radius: 0.5
    note: mechanic garage, south of its middle
  - at: [-589021.606, -1250154.826]
    radius: 0.5
    note: mechanic garage, north wall
  # The plantation (issue 364, ground patch GP-0085): the trees that stand inside it.
  - at: [-588402.84, -1248909.34]
    radius: 0.6
    note: plantation
  - at: [-588405.56, -1248905.86]
    radius: 0.6
