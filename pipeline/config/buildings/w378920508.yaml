# P-0028 (property group G-0001), from one close Street View frame of the street-facing gable (no scale
# reference but the footprint, so every number is +-0.2 m).
#
# Edge 2 (6.82 m) is the street GABLE wall; the ridge runs perpendicular to it (ridge_dir 15 deg). Walking
# edge 2 from its start is left -> right as seen from the street. at_m = pixels from the left wall corner
# times 6.82 m / 475 px (wall corners at the foot of the gable, rake overhang not counted); heights are
# scaled the same way from a ground line estimated at the hidden wall foot (bushes), so the lower sills
# are the weakest numbers. The eave is 3.0 m, so the two small upper windows sit inside the gable.
#
# Not modelled: the satellite dish and rust-coloured disc on the left, the vine on the right rake, the
# separate hip-roofed look of the rear wing (its walls are part of this footprint), the
# wooden gate and brick pillar (street fence, not part of the house).
