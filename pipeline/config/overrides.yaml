# Manual corrections applied at the end of the rules stage (data/work/buildings.json).
#
# Keep this file small: it is for cases the automatic rules get wrong. The map is still
# regenerated from scratch, so overrides must stay valid across regenerations.
#
# Format: one top-level key `buildings`, a mapping from a key to a mapping of fields.
#   key      our parcel ID (`P-0001`, applies to every building on that parcel) or an OSM id
#            (`w123456`, one building). Parcel entries apply first, OSM id entries after them.
#   fields   any of the building fields below; unknown fields are an error.
#              height_m      total height to the roof top, metres
#              roof_height_m rise from the eave to the ridge, metres (else from the roof pitch, capped);
#                            the eave is then height_m - roof_height_m
#              levels        number of storeys
#              roof          flat | gabled | hipped (no footprint-fill fallback is applied)
#              ridge_dir     ridge direction in radians (counter-clockwise from east, 0..pi)
#              wall_colour   "#rrggbb"
#              roof_colour   "#rrggbb"
#              model         name of a hand-modelled landmark (pipeline/src/suchohrad_pipeline/landmarks.py)
#                            that replaces the generated mesh, e.g. church
#              model_axis    with model: bearing of the model's front in radians, counter-clockwise from east
# Keys that match no building are reported as a warning.
#
# Example (commented out):
# buildings:
#   P-0042:
#     wall_colour: "#d8c8a8"
#   w123456:
#     height_m: 9.5
#     roof: hipped
buildings:
  # The church (dominant of the village): modelled by hand from photos, on its real footprint.
  # Its front (tower and porch) faces 56.66 degrees (north-east).
  w378900220:
    model: church
    model_axis: 0.9890


  # P-0030, from two close Street View frames: pale yellow-cream walls, orange-red ceramic tile, a steep
  # (about 45 degrees) roof, so about 9.2 m to the ridge instead of the generated 7. Openings and overhang
  # are in config/buildings/w378920362.yaml.
  w378920362:
    wall_colour: "#e8d4a2"
    roof_colour: "#b8532f"
    levels: 1
    height_m: 9.2
    roof_height_m: 5.6  # measured: steep roof, eave 3.6 m, ridge 9.2 m

  # WW2 bunkers (P-0876, P-0823): the real footprint with a rounded concrete dome, an open doorway and
  # firing slits; players can go in (pipeline/src/suchohrad_pipeline/bunker.py). model_axis is the
  # bearing the door faces: towards the parcel's road side.
  w378900225:
    model: bunker
    model_axis: 0.6905
  w378900206:
    model: bunker
    model_axis: -2.4043
  # The third bunker (on P-0829): OSM draws it as a plain building. The door is on its long west wall.
  w825140518:
    model: bunker
    model_axis: -3.0850

  # P-0675 (Kultúrny dom): flat roof, about 4.4 m, white-grey render. Openings in config/buildings/.
  w378900226:
    wall_colour: "#e6e4dc"
    roof_colour: "#5c5f66"
    levels: 1
    height_m: 4.4
    roof: flat

  # P-1135: long hall with a red tile roof, pale grey-cream render. Openings in config/buildings/.
  w378900330:
    wall_colour: "#d9d4c6"
    roof_colour: "#b4502f"

  # P-0288 (Obecny urad Suchohrad): long single-storey office of three bars, white render, hipped
  # terracotta roofs, eave about 3.0 m (measured from Street View section frames). The generated defaults
  # (two storeys, gabled, brown/grey roofs) were wrong. Roof rise 1.8 m is a visual estimate.
  # Openings of the road-facing walls are in config/buildings/. The south-west bar (w378900312) measured
  # 3.5 m to the eave from poor frames, but the eave line continues unbroken into the middle bar in the
  # photos, so it uses 3.0 m too.
  w378900312:
    model: office
    wall_colour: "#f0ece2"
    roof_colour: "#c86040"
    levels: 1
    roof: hipped
    height_m: 4.8
    roof_height_m: 1.8
  w378900355:
    model: office
    wall_colour: "#f0ece2"
    roof_colour: "#c86040"
    levels: 1
    roof: hipped
    height_m: 4.8
    roof_height_m: 1.8
  w378900320:
    model: office
    wall_colour: "#f0ece2"
    roof_colour: "#c86040"
    levels: 1
    roof: hipped
    height_m: 4.8
    roof_height_m: 1.8

  # P-0028 (G-0001): old village house, street gable to the road, grey-white weathered render, orange-red
  # clay tile, steep (about 47 degrees) roof. Eave about 3.0 m, ridge about 6.6 m, scaled from one Street
  # View frame. The attic has two small windows in the gable, so it is one storey plus attic. Openings
  # are in config/buildings/.
  w378920508:
    wall_colour: "#d9d7d0"
    roof_colour: "#b8532f"
    levels: 1
    roof: gabled
    height_m: 6.6
    roof_height_m: 3.6

  # P-0561 (Suchohrad 295): two-storey house of four flats, pale cream render, one gabled roof with a
  # deep front overhang, loggias with balconies and a staircase block over the open entrance. Modelled by
  # hand from four Street View frames (pipeline/src/suchohrad_pipeline/flats.py); the generated default
  # (four storeys, flat roof, 11.5 m) was wrong. The roof and height here only describe the model.
  w378900224:
    model: flats
    wall_colour: "#ece6cc"
    roof_colour: "#5f5650"
    levels: 2
    roof: gabled
    height_m: 7.15
    roof_height_m: 1.7

  # P-0562: the twin of Suchohrad 295 in the same property group (G-0097), the same cadastral outline
  # (22.35 x 9.13 m, the same stepped front) one row to the north. Not photographed: it reuses the model
  # of 295 as it is, including that house's door colours and the closet on the west terrace.
  w378900223:
    model: flats
    wall_colour: "#ece6cc"
    roof_colour: "#5f5650"
    levels: 2
    roof: gabled
    height_m: 7.15
    roof_height_m: 1.7

  # The six two-storey houses of flats in the east of the village: the row P-0297, P-0296,
  # P-0295 and the row P-0331 (inside P-0330), P-0332 (G-0070), P-0333 (G-0069). Grey render, flat roof,
  # corner loggias and a staircase bay set back in the street front. Modelled by hand from two Street View
  # frames of one of them (pipeline/src/suchohrad_pipeline/loggia_house.py); the generated default (four
  # storeys, 12 m) was wrong. model_axis is the bearing the loggia front faces: south-west, away from
  # the access road, which runs along the rear wall with the door. All six use the model as it is;
  # P-0333 is 23.9 m long with a small projection at the rear, so there the model is stretched by 1.4
  # along the front and ignores the projection.
  w378920386:
    model: loggia_house
    model_axis: -2.17
    wall_colour: "#99958b"
    roof_colour: "#6c6e70"
    levels: 2
    roof: flat
    height_m: 6.3
