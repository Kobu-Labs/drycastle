# Manual corrections applied at the end of the rules stage (data/village/work/buildings.json).
#
# Keep this file small: it is for cases the automatic rules get wrong. The map is still
# regenerated from scratch, so overrides must stay valid across regenerations.
#
# Format: one top-level key `buildings`, a mapping from a key to a mapping of fields.
#   key      our parcel ID (`P-0001`, applies to every building on that parcel) or an OSM id
#            (`w123456`, one building). Parcel entries apply first, OSM id entries after them.
#   fields   any of the building fields below; unknown fields are an error.
#              height_m      total height to the roof top, metres
#              roof_height_m rise from the eave to the ridge, metres (else from the roof pitch, capped);
#                            the eave is then height_m - roof_height_m
#              levels        number of storeys
#              roof          flat | gabled | hipped | lean_to (no footprint-fill fallback is applied)
#              ridge_dir     ridge direction in radians (counter-clockwise from east, 0..pi; lean_to: 0..2 pi,
#                            its high edge is on the left of that direction)
#              wall_colour   "#rrggbb"
#              roof_colour   "#rrggbb"
#              model         name of a hand-modelled landmark (pipeline/src/drycastle_pipeline/buildings/landmarks/catalog.py)
#                            that replaces the generated mesh, e.g. church
#              model_axis    with model: bearing of the model's front in radians, counter-clockwise from east
#              remove        true: the building is left out of the map (a placed object stands there instead)
#              roof_part     [[x, y], ...] polygon in map metres: the pitched roof covers only the footprint inside it
#                            (the main house); every other piece of the footprint is a flat-roofed block
#              rest_height_m with roof_part: the height of those blocks (default 2.8 or the eave if that is lower)
# Keys that match no building are reported as a warning.
#
# Example (commented out):
# buildings:
#   P-0042:
#     wall_colour: "#d8c8a8"
#   w123456:
#     height_m: 9.5
#     roof: hipped
# keep_traced_footprint: buildings (OSM id) or parcels whose footprint stays as traced in OpenStreetMap. Every other
# footprint is set right by the cadastre when the buildings are derived (buildings/cadastre_check.py): replaced by
# its plot where the plot is the house, slid into its plot, or cut at a neighbour's plot. Listed here are the
# buildings modelled by hand on the traced outline (their detail files and roof parts refer to its walls).
keep_traced_footprint: [w1226408502, w378900206, w378900220, w378900223, w378900224, w378900225, w378900226, w378900312, w378900320, w378900330, w378900337, w378900355, w378920332, w378920342, w378920355, w378920362, w378920373, w378920386, w378920410, w378920412, w378920432, w378920508, w378920521, w378920531, w378920537, w825140518,
  # restored from an earlier run, measured on the traced outline:
  w378900354, w378920407, w378920451, w378920522]

buildings:
  # The church (dominant of the village): modelled by hand from photos, on its real footprint.
  # Its front (tower and porch) faces 56.66 degrees (north-east).
  w378900220:
    model: church
    model_axis: 0.9890


  # P-0030, from two close Street View frames: pale yellow-cream walls, orange-red ceramic tile, a steep
  # (about 45 degrees) roof, so about 9.2 m to the ridge instead of the generated 7. Openings and overhang
  # are in config/buildings/w378920362.yaml.
  w378920362:
    wall_colour: "#e8d4a2"
    roof_colour: "#b8532f"
    levels: 1
    height_m: 9.2
    roof_height_m: 5.6  # measured: steep roof, eave 3.6 m, ridge 9.2 m

  # WW2 bunkers (P-0876, P-0823): the real footprint with a rounded concrete dome, an open doorway and
  # firing slits; players can go in (pipeline/src/drycastle_pipeline/buildings/landmarks/bunker.py). model_axis is the
  # bearing the door faces: towards the parcel's road side.
  w378900225:
    model: bunker
    model_axis: 0.6905
  w378900206:
    model: bunker
    model_axis: -2.4043
  # The third bunker (on P-0829): OSM draws it as a plain building. The door is on its long west wall.
  w825140518:
    model: bunker
    model_axis: -3.0850

  # P-0675 (Kultúrny dom): flat roof, about 4.4 m, white-grey render. Openings in config/buildings/.
