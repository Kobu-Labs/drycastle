name: ci
on:
  pull_request:
  push:
    branches-ignore: [main, release]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No paid asset is tracked
        run: scripts/check-no-private-assets.sh
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: 8.0.x }
      - run: dotnet test godot/ShooterCore.Tests/ShooterCore.Tests.csproj
