# Builds the launcher the players install once. Push a tag `launcher-vX.Y.Z` (or run manually); the launcher updates the game, not itself.
name: launcher
on:
  push:
    tags: ['launcher-v*']
  workflow_dispatch:
permissions: { contents: write }
env:
  GODOT_VERSION: 4.7.2
  GH_TOKEN: ${{ github.token }}
jobs:
  launcher:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: 8.0.x }
      - run: dotnet test godot/ShooterCore.Tests/ShooterCore.Tests.csproj --filter "FullyQualifiedName~Launcher"
      - name: Install Godot mono and export templates
        uses: ./.github/actions/setup-godot
      - run: make launcher-export
      - name: Publish
        run: |
          tag="${GITHUB_REF_NAME}"; [[ "$GITHUB_REF" == refs/tags/launcher-v* ]] || tag="launcher-manual-${GITHUB_RUN_NUMBER}"
          # prerelease so GitHub "latest" (what the launcher asks for stable game builds) never points at a launcher release
          gh release create "$tag" --prerelease --target "$GITHUB_SHA" --title "Launcher $tag" --notes "Install once; it keeps the game updated. Windows may show SmartScreen: More info, Run anyway. Linux: unzip, chmod +x, run. macOS: unzip, then see README.txt (the app is unsigned, so Gatekeeper needs one approval)." out/launcher/drycastle-launcher-windows.zip out/launcher/drycastle-launcher-linux.zip out/launcher/drycastle-launcher-macos.zip
