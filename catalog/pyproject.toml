[project]
name = "asset-catalog"
version = "0.1.0"
description = "Searchable catalogue of every asset: measured, rendered, described, indexed"
requires-python = ">=3.13,<3.14"
dependencies = [
    "pydantic>=2",
    "pyyaml",
    "numpy",
    "trimesh",
    "pillow",
    "anthropic",
    "moderngl>=5.13.0",
    "glcontext>=3.1.0",
    "torch>=2.15.0",
    "transformers>=5.24.1",
    "sentence-transformers>=6.3.0",
    "fastapi>=0.165.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
catalog = "asset_catalog.cli:main"

[dependency-groups]
dev = ["pytest", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/asset_catalog"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
