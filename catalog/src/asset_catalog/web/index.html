<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="referrer" content="no-referrer">
  <title>Asset catalog</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="app.css">
  <script type="module" src="main.js"></script>
</head>
<body>
  <svg class="sprite" aria-hidden="true" focusable="false">
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></symbol>
    <symbol id="i-filter" viewBox="0 0 24 24"><path d="M3 5h18l-7 8v6l-4 2v-8z"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
    <symbol id="i-chevron-right" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></symbol>
    <symbol id="i-chevron-left" viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12l5 5 9-10"/></symbol>
    <symbol id="i-theme" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 4v16"/><path d="M12 4a8 8 0 0 1 0 16z" fill="currentColor"/></symbol>
    <symbol id="i-grid" viewBox="0 0 24 24"><rect x="4" y="4" width="7" height="7"/><rect x="13" y="4" width="7" height="7"/><rect x="4" y="13" width="7" height="7"/><rect x="13" y="13" width="7" height="7"/></symbol>
    <symbol id="i-ruler" viewBox="0 0 24 24"><path d="M3 17L17 3l4 4L7 21z"/><path d="M7 13l2 2M10 10l2 2M13 7l2 2"/></symbol>
    <symbol id="i-cube" viewBox="0 0 24 24"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9z"/><path d="M12 12l8-4.5M12 12v9M12 12L4 7.5"/></symbol>
    <symbol id="i-file" viewBox="0 0 24 24"><path d="M6 3h8l5 5v13H6z"/><path d="M14 3v5h5"/></symbol>
    <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 6h6l2 2h10v11H3z"/></symbol>
    <symbol id="i-layers" viewBox="0 0 24 24"><path d="M12 3l9 5-9 5-9-5z"/><path d="M3 13l9 5 9-5"/></symbol>
    <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.01"/></symbol>
    <symbol id="i-tag" viewBox="0 0 24 24"><path d="M3 12V4h8l10 10-8 8z"/><circle cx="7.5" cy="8.5" r="1"/></symbol>
    <symbol id="i-brick" viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="12"/><path d="M3 12h18M9 6v6M15 12v6"/></symbol>
    <symbol id="i-pin" viewBox="0 0 24 24"><path d="M12 21s7-6.2 7-11a7 7 0 0 0-14 0c0 4.8 7 11 7 11z"/><circle cx="12" cy="10" r="2.5"/></symbol>
    <symbol id="i-anchor" viewBox="0 0 24 24"><path d="M12 4v10M7 10l5 5 5-5M5 20h14"/></symbol>
    <symbol id="i-bolt" viewBox="0 0 24 24"><path d="M13 3L5 14h6l-1 7 8-11h-6z"/></symbol>
    <symbol id="i-sparkle" viewBox="0 0 24 24"><path d="M12 3l2 6 6 2-6 2-2 6-2-6-6-2 6-2z"/></symbol>
    <symbol id="i-wrench" viewBox="0 0 24 24"><path d="M14 6a4 4 0 0 0 5 5l-9 9a2.1 2.1 0 0 1-3-3l9-9a4 4 0 0 0-2-2z"/></symbol>
    <symbol id="i-palette" viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 0 18c1.5 0 2-1 1.5-2-.6-1.2.2-2.5 1.5-2.5H17a4 4 0 0 0 4-4C21 6.5 17 3 12 3z"/><path d="M8 11h.01M12 8h.01M16 11h.01"/></symbol>
    <symbol id="i-bone" viewBox="0 0 24 24"><circle cx="12" cy="5" r="2"/><path d="M12 7v7M7 10h10M9 21l3-7 3 7"/></symbol>
    <symbol id="i-copy" viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h8"/></symbol>
    <symbol id="i-compare" viewBox="0 0 24 24"><rect x="3" y="7" width="10" height="10"/><rect x="11" y="7" width="10" height="10"/></symbol>
    <symbol id="i-warning" viewBox="0 0 24 24"><path d="M12 3l10 18H2z"/><path d="M12 10v5M12 18v.01"/></symbol>
    <symbol id="i-error" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v6M12 16.5v.01"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
    <symbol id="i-lock" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></symbol>
    <symbol id="i-bulb" viewBox="0 0 24 24"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-4 10.5c.7.7 1 1.5 1 2.5h6c0-1 .3-1.8 1-2.5A6 6 0 0 0 12 3z"/></symbol>
    <symbol id="i-text" viewBox="0 0 24 24"><path d="M5 6h14M12 6v13M9 19h6"/></symbol>
    <symbol id="i-image-off" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M3 17l5-4 4 3 3-2 6 4"/></symbol>
    <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.3-5.7M20 4v4h-4"/></symbol>
    <symbol id="i-x-circle" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9 9l6 6M15 9l-6 6"/></symbol>
    <symbol id="i-hash" viewBox="0 0 24 24"><path d="M5 9h14M5 15h14M10 4L8 20M16 4l-2 16"/></symbol>
    <symbol id="i-spinner" viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 9 9"/></symbol>
    <symbol id="i-mesh" viewBox="0 0 24 24"><path d="M4 18L12 5l8 13zM12 5v13"/></symbol>
    <symbol id="i-crosshair" viewBox="0 0 24 24"><circle cx="12" cy="12" r="6"/><path d="M12 3v5M12 16v5M3 12h5M16 12h5"/></symbol>
    <symbol id="i-list" viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></symbol>
  </svg>

  <a class="skip-link" href="#results-main">Skip to results</a>

  <header class="topbar">
    <h1 class="brand"><svg class="icon icon-lg" aria-hidden="true"><use href="#i-cube"/></svg>Asset catalog</h1>
    <form class="search" id="search-form" role="search">
      <div class="search-field">
        <svg class="icon" aria-hidden="true"><use href="#i-search"/></svg>
        <label class="vh" for="q">Search assets</label>
        <input id="q" type="search" autocomplete="off" spellcheck="false" enterkeyhint="search"
               placeholder="Describe what you need, e.g. something to sit on in a waiting area">
        <button type="button" class="btn btn-quiet" id="q-clear" hidden title="Clear the search text">
          <svg class="icon" aria-hidden="true"><use href="#i-close"/></svg><span class="vh">Clear the search text</span>
        </button>
      </div>
      <button type="submit" class="btn btn-primary" id="search-btn">Search</button>
    </form>
    <div class="tools">
      <button type="button" class="btn btn-toggle" id="filters-toggle" aria-controls="filters" aria-expanded="true"
              title="Show or hide the filters and search stages">
        <svg class="icon" aria-hidden="true"><use href="#i-filter"/></svg>Filters
        <span class="badge-count" id="filters-count" hidden></span>
      </button>
      <div class="btn-group" role="group" aria-label="Grid density" id="density">
        <button type="button" class="btn" data-density="s" aria-pressed="false" title="Small cards">
          <svg class="icon" aria-hidden="true"><use href="#i-grid"/></svg>S</button>
        <button type="button" class="btn" data-density="m" aria-pressed="true" title="Medium cards">M</button>
        <button type="button" class="btn" data-density="l" aria-pressed="false" title="Large cards">L</button>
      </div>
      <button type="button" class="btn" id="theme-btn" title="Colour theme: follows the system, or light, or dark">
        <svg class="icon" aria-hidden="true"><use href="#i-theme"/></svg>Theme: <span id="theme-label">Auto</span>
      </button>
    </div>
  </header>

  <div class="layout" id="layout" data-filters="open">
    <aside class="panel" id="filters" aria-label="Filters and search stages">
      <section class="panel-section" aria-labelledby="stages-h">
        <h2 class="panel-title" id="stages-h"><svg class="icon" aria-hidden="true"><use href="#i-list"/></svg>Search stages</h2>
        <div id="stages"></div>
      </section>
      <section class="panel-section" aria-labelledby="filters-h">
        <h2 class="panel-title" id="filters-h"><svg class="icon" aria-hidden="true"><use href="#i-filter"/></svg>Filters</h2>
        <p class="stage-note">Every selected filter is a hard constraint.</p>
        <div class="panel-actions">
          <button type="button" class="btn btn-small" id="clear-all" disabled>
            <svg class="icon" aria-hidden="true"><use href="#i-x-circle"/></svg>Clear all</button>
          <label class="check"><input type="checkbox" id="show-empty"><span class="grow">Show terms with 0 assets</span></label>
        </div>
        <div id="facets"></div>
      </section>
    </aside>

    <main class="main" id="results-main" tabindex="-1" aria-label="Results">
      <div class="banners" id="banners"></div>
      <div class="summary" id="summary" role="status" aria-live="polite"></div>
      <div class="understood" id="understood" hidden></div>
      <section class="progress" id="progress" role="status" hidden>
        <div class="progress-head">
          <svg class="icon spin" aria-hidden="true"><use href="#i-spinner"/></svg>
          <span id="progress-title">Searching</span>
          <span class="time" id="progress-time">0.0 s</span>
        </div>
        <ol class="steps" id="progress-steps"></ol>
      </section>
      <div id="state"></div>
      <ol class="grid" id="results" aria-label="Assets" hidden></ol>
      <nav class="pager" id="pager" aria-label="Pages" hidden></nav>
    </main>

    <aside class="drawer" id="drawer" role="dialog" aria-modal="false" aria-labelledby="drawer-title" hidden></aside>
  </div>

  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Full size picture" hidden></div>
  <div class="toasts" id="toasts" role="status" aria-live="polite"></div>

  <footer class="hints" id="hints">
    <span><kbd>/</kbd> Search</span>
    <span><kbd>&darr;</kbd> From search to results</span>
    <span><kbd>&larr;</kbd><kbd>&uarr;</kbd><kbd>&darr;</kbd><kbd>&rarr;</kbd> Move</span>
    <span><kbd>Enter</kbd> Details</span>
    <span><kbd>S</kbd> Similar</span>
    <span><kbd>V</kbd> Variants</span>
    <span><kbd>W</kbd> Why</span>
    <span><kbd>Esc</kbd> Back</span>
  </footer>
</body>
</html>
