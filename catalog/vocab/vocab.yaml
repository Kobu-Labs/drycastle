status: working version, not yet approved
notes:
- 'Function: decorate, set dressing, litter, add greenery, decorate sky and similar catch-alls were dropped.
  Roles visible from kind (wildlife, npc, companion, roam) and those a vision model cannot judge (enemy,
  destructible) were also dropped. Cover was split into full-cover and low-cover because shooter level
  builders need crouch-height cover.'
- 'Interactive parts: the raw interactive_parts data (doors, lids, drawers, hatches) became the function
  openable. Wheels, legs and tails should not be described. Rigged or animated status (SK_ meshes, animated-*
  packs) should come from file metadata as a boolean, not from vision.'
- 'Kind changes: structure was added so fences, bridges and poles are not mixed with modular building
  pieces. Rock, decal and backdrop are their own kinds. Sign and tool were folded into prop, and sky into
  backdrop. The furniture/prop line is: furniture is something you sit, sleep, work at, store in or wash
  at; everything else movable is prop.'
- Wrecks and destroyed variants (_Destroyed, _Broken, _Burnt, Car_Wrecked) take the same leaf as the intact
  item, with condition destroyed or damaged. building/ruin is only for ruins whose original type is unclear.
  Crushed or stacked car piles go to prop/debris/scrap-wreckage.
- 'Placement: on the floor, on the ground and freestanding (outdoors, indoors, on ground) were merged
  into floor-standing, since indoor versus outdoor belongs to setting. Hundreds of ''on a table/desk/shelf/counter''
  variants became on-surface. Linear runs and grid snapping were merged into modular.'
- 'Setting: the raw list had about 600 near-duplicates. Collapse rule: a qualifier such as post-apocalyptic,
  ruined, abandoned or war-torn goes to style or condition, and the place noun goes to setting. Room-level
  interior terms were added despite low sample counts because the first consumer furnishes rooms. Public
  washrooms share bathroom. Home garage and auto workshop were merged.'
- 'Setting overuse: raw over-applied military base (101) and battlefield (65). Tell the describer to choose
  the most specific place, at most 3, and to use battlefield only when combat is evident.'
- 'Style: modern was dropped because it applied to nearly everything; no period style means present day.
  Natural, wild and nature were dropped because kind covers them. Farm, agricultural and rustic were merged
  into rural. Desert, swamp and wetland moved to setting. Wartime, cold war and german map to military,
  plus wwii where it fits.'
- 'Style priors from pack: consider seeding style from the pack name for consistency (war -> wwii, apocalypse
  -> post-apocalyptic, gang-warfare -> criminal, office -> office, kenney -> cartoon) and letting the
  describer add more.'
- 'Material: synonyms were merged (steel, iron, chrome, painted metal -> metal; dirt, earth, mud -> soil;
  leaves, foliage, moss, hay -> plant; cloth, canvas, tarp -> fabric). Rust and paint are condition or
  free text.'
- 'Colour: the raw colour terms are noisy (grey, dark grey, olive green and so on). Leave colour to free
  text, or add a small fixed palette of about 12 colours if colour filtering is wanted.'
- 'Condition: broken was merged into damaged, and dirty, weathered and faded into worn. Burnt and muddy
  go to free text. Clean/Dirty and Open/Closed variant pairs (Crate_Open, Hangar_Open, Setup_Dirty) are
  states, not conditions; put them in aliases, or add a small state facet (open, closed, filled, empty)
  if agents need it.'
- 'Missing facet: scale is absent from raw data but matters to level-building agents. Add a size class
  or real dimensions computed from mesh bounds rather than from vision.'
- 'Variants and presets: xN variants should share one description and differ only where the mesh does
  (condition, colour). _Preset, _Group and _Stack composites take the leaf of their dominant item and
  get the placement stacked where it applies.'
- 'Leaf judgement calls: a few leaves are small but kept for strong browse intent (mushroom, fuel-pump,
  barracks-hall, cactus-palm, decal/damage). Greenhouse was merged into barn-outbuilding and silo into
  tower-tank. Unicorn goes to livestock and phoenix to bird, both with style fantasy, instead of a two-item
  mythical leaf. prop/misc/other is the only catch-all leaf.'
kind:
  building: Complete standalone building or tent that reads as a whole, such as a house, barn, tower or
    tent; a single wall or floor segment is building-piece.
  building-piece: 'Modular segment that snaps together into a building: wall, floor, ceiling, roof, door,
    window, stairs or beam; not a whole building.'
  structure: 'Fixed outdoor construction that is not a building: fence, freestanding wall, bridge, jetty,
    pole, pipeline, scaffold, statue or court; movable barriers are prop.'
  terrain: Ground surface piece such as a ground tile, hill, road, sidewalk, water plane or canal; loose
    rocks are rock and vegetation is plant.
  plant: Living or dead vegetation, including trees, logs, stumps, grass, crops and potted plants; harvested
    fruit and vegetables are prop.
  rock: 'Natural rock: boulder, rock pile, pebbles, cliff or crystal; broken concrete or brick is prop
    (rubble).'
  vehicle: Whole vehicle, drivable or wrecked; separate attachments and loose parts are vehicle-part.
  vehicle-part: Attachment or loose component for a vehicle, such as armour, bumper, wheel, roof cargo
    or farm implement.
  weapon: Firearm, heavy or melee weapon, explosive, ammunition or missile.
  furniture: Furnishing used to sit, sleep, work at, store things in or wash, such as a chair, bed, shelf,
    toilet or rug; small objects are prop.
  prop: Any other movable object, from handheld items to dumpsters and barriers.
  decal: Flat overlay with almost no volume laid on a surface, such as a blood pool, bullet holes or road
    markings; a 3D puddle mesh is still decal.
  character: Complete human or humanoid figure, including monsters on two legs.
  character-part: Head base or wearable or attachable piece of a character, such as a helmet, pack or
    tail.
  animal: Complete non-humanoid creature, real or mythical.
  backdrop: Sky dome, cloud or distant scenery card that is never meant to be reached.
material:
  metal: 'Any metal: steel, iron, painted, galvanised or corrugated sheet; record rust under condition,
    not here.'
  wood: Timber, planks, plywood, logs or bark; not paper or cardboard.
  plastic: Plastic, vinyl or polymer bodies and parts.
  concrete: Poured concrete, cinderblock or cement; not brick or natural stone.
  stone: Natural or cut stone, including gravel; not concrete or brick.
  brick: Fired brick walls, piles or pieces.
  plaster: Painted plaster, drywall or render finish on interior walls and ceilings.
  glass: Glass panes, bottles, screens or shards.
  rubber: Tyres, rubber mats, hoses.
  fabric: Cloth, canvas, tarp, burlap, carpet, upholstery or padding.
  leather: Leather goods such as a holster, couch or bag; not animal fur.
  paper: Paper sheets, books, posters, banknotes or packets; not cardboard.
  cardboard: Cardboard boxes and card packaging.
  ceramic: Porcelain, clay, terracotta or pottery, such as a toilet, vase or jar.
  gold: Gold or gilded objects such as treasure, plates or jewellery.
  crystal: Crystal or gemstone formations.
  plant: Leaves, grass, moss, straw, hay or other plant tissue; cut timber is wood.
  food: 'Edible matter: fruit, vegetables, meat.'
  soil: Dirt, earth or mud surfaces and piles; not sand.
  sand: Beach or desert sand.
  asphalt: Tarmac road or parking surface.
  water: Water or other liquid surfaces, including puddles and blood pools.
  fur-feather: Animal fur, hide, feathers or creature skin.
  bone: Bone, skulls, horn or antler.
setting:
  living-room: Home lounge with sofa, TV and coffee table; desk-and-books rooms are study.
  bedroom: Adult home bedroom; children's rooms are kids-room and soldiers' quarters are barracks.
  kids-room: Nursery or child's bedroom with toys or a cot.
  kitchen: Home kitchen with appliances and cabinets; an office kitchenette is break-room.
  dining-room: Home room for eating at a table; diners and cafes are restaurant.
  bathroom: Any toilet, washroom or shower room, home or public.
  hallway: Corridor, entrance hall or stairwell.
  study: Home office or library with desk and books; corporate workspace is office.
  utility-room: Laundry, storeroom, boiler room or cleaning cupboard.
  office: Corporate workspace with desks and computers; not meeting-room.
  meeting-room: Conference or briefing room with a large table, boards or projector.
  reception: Lobby or front-desk area of an office or public building.
  break-room: Staff kitchenette or lounge with water cooler and coffee.
  shop: Retail interior or storefront with shelves, counters or checkouts.
  restaurant: Diner, cafe or food-stand area; drinking venues are bar-nightclub.
  bar-nightclub: Bar, pub or club with alcohol, stools and speakers.
  church: Church, chapel or shrine, inside or in its grounds.
  classroom: School room with blackboard and desks.
  hospital: Clinic, ward, field hospital or medical tent.
  gym: Fitness or training room with weights and mats.
  warehouse: Storage hall or loading dock with racks and pallets; production lines are factory.
  factory: Manufacturing or processing plant with machinery.
  workshop-garage: Vehicle garage, repair bay or tool workshop.
  gang-hideout: Criminal den, drug lab or stash house.
  construction-site: Active building site with scaffolds and materials.
  scrapyard: Junkyard of wrecked cars, tyres and scrap.
  industrial-site: Outdoor refinery, pipeline, power or utility yard; not a factory interior.
  military-base: Armed-forces compound, depot, motor pool or helipad.
  barracks: Soldiers' living quarters with bunks and lockers.
  command-post: Briefing, radio, drone or control room.
  bunker: Underground shelter or fortified concrete room.
  battlefield: Active combat zone, frontline or trenches; use only when combat is evident, not for any
    military item.
  checkpoint: Guarded roadblock or gated entry point.
  camp: 'Tent camp: refugee, survivor, military field camp or campsite.'
  airfield: Runway, hangar apron or airstrip.
  shooting-range: Firing range with lanes and targets.
  city-street: Urban road, sidewalk and storefronts; not suburb.
  alley: Narrow back street behind buildings.
  suburb: Residential street with houses, driveways, mailboxes and front yards.
  car-park: Parking lot or parking garage.
  town-square: Plaza, market square or town centre.
  rooftop: Flat roof of a building.
  highway: Motorway, overpass, ramp or road tunnel.
  gas-station: Fuel station forecourt.
  park: Public park, playground or sports court.
  garden: Private garden or backyard with flower beds; cultivated fields are farm-field.
  farmyard: Yard around barns and farmhouse with tools and animal pens.
  farm-field: Crop field, orchard or pasture.
  village: Small rural, medieval or desert settlement; not city-street.
  country-road: Rural road or dirt track between places.
  forest: Woodland, forest floor or clearing.
  meadow: Open uncultivated grassland or countryside.
  swamp: Marsh, bog or wetland.
  lakeside: River bank, lake or pond shore; sea coasts are beach.
  beach: Sandy sea coast or shoreline.
  desert: Sand dunes, arid ground or oasis.
  mountain: Rocky hillside, cliff or canyon.
  cave: Cavern, dungeon or crystal cave.
  wasteland: Barren post-apocalyptic outskirts and scrubland; destroyed towns are ruins.
  ruins: Destroyed town or area of ruined buildings.
  harbour: Port, dock, pier or jetty.
placement:
  floor-standing: Stands on its own on the floor or ground; use against-wall instead when its back is
    meant to face a wall.
  against-wall: Stands on the floor with its back to a wall, such as a wardrobe, bookshelf or fridge.
  wall-mounted: Fixed to or hung on a wall off the floor, such as a poster, wall light or AC unit.
  ceiling-hung: Hangs from or is fixed to an indoor ceiling; outdoor spans are overhead.
  on-surface: Small item meant to sit on a table, desk, shelf or counter; not scattered.
  part-of-ground: Forms the ground or lies flush with it, such as a terrain tile, road, decal or ground
    cover.
  scattered: Loose litter or small items strewn on the ground or floor.
  stacked: Designed to stack, or shown stacked with copies, such as crates, pallets or tyres.
  in-opening: Fits into a door or window opening in a wall, such as a door, shutter or blind.
  rooftop: Sits on a roof, such as a chimney, satellite dish, roof AC unit or roof billboard.
  overhead: Spans above head height outdoors, such as a power line, awning, canopy or string lights.
  on-water: Floats on the water surface, such as a lily pad, scum or boat.
  shoreline: Stands at the water's edge or partly in shallow water, such as reeds, a jetty or a mangrove.
  vehicle-mounted: Attaches to a vehicle body.
  carried: Held in a hand or worn by a character.
  sky: Floats or flies in the sky, such as clouds or birds aloft.
  distant: Far-background only and never reached, such as a skydome, background card or distant mountains.
  modular: Joins edge to edge with matching pieces, such as walls, floors, road tiles, fence runs or pipes.
function:
  full-cover: Solid and tall enough to hide a standing character from gunfire; waist-high objects are
    low-cover.
  low-cover: Solid waist-high object a character can crouch behind.
  concealment: Hides a character from view but would not stop bullets, such as a bush, tall grass, tarp
    or camo net.
  obstacle: Blocks movement on foot; use roadblock when it is meant to stop vehicles.
  roadblock: Built or placed to stop vehicles, such as a concrete barrier, tank trap or road barrier.
  boundary: Marks or encloses the edge of an area, such as a fence or wall run.
  hazard: Hurts or impedes on contact, such as razor wire, spikes, fire, a toxic spill or a trap.
  explosive: Could plausibly explode, such as a fuel can, propane bottle, mine or missile.
  seating: Designed to be sat on.
  sleeping: Designed to lie or sleep on.
  surface: Flat top for placing items or working, such as a table, desk, counter or workbench.
  storage: Holds other items, such as a shelf, cabinet, crate or locker; display is for showing goods.
  display: Presents goods or information for viewing, such as a shop shelf, stall, mannequin or notice
    board.
  openable: Has a visible door, lid, drawer or hatch that could open.
  light-source: Emits or is meant to emit light.
  power-source: Supplies electricity or fuel, such as a generator, battery, power box or fuel pump.
  cooking: Used to cook or heat food, such as a stove, grill, oven or fire pit.
  shelter: Provides a roof or shade overhead, such as a tent, awning or shack.
  walkable: Designed to be walked or driven on as ground or a platform, such as a floor, road, bridge
    or jetty.
  vertical-access: Lets characters change level, such as stairs, a ladder, a ramp or a climbing rope.
  vantage-point: Raised position to look out or shoot from, such as a guard tower or platform.
  landmark: Large or distinctive enough to navigate by from afar.
  drivable: Whole vehicle in a usable state; never use for wrecks.
  weapon: Can be wielded, thrown or fired as a weapon.
  pickup: Small item a player could pick up or loot, such as ammo, medicine, money, keys or a tool.
  consumable: Eaten, drunk or used up, such as food, drink, medicine or drugs.
style:
  military: Armed-forces equipment or installations of any era; add wwii only for that period.
  wwii: 1939-45 period gear such as German, British or US WWII weapons, helmets and posters.
  post-apocalyptic: Abandoned, quarantine or wasteland survival theme; makeshift is for objects built
    from scrap.
  makeshift: Improvised from scrap, junk or salvaged parts, such as junk walls, spiked bumpers or pallet
    barricades.
  industrial: Factories, pipes, heavy machinery and utilities.
  urban: City streets, shops and high-rise buildings; residential streets are suburban.
  suburban: Residential houses, gardens, driveways and mailboxes.
  rural: Farm and countryside, including rustic wooden handmade items.
  office: Corporate office workplace.
  middle-eastern: Desert-village architecture, woven rugs, clay pots and cloth sunshades.
  medieval: 'Pre-industrial European: peasants, monks, pews, wells.'
  fantasy: 'Magical or mythical: crystals, unicorn, phoenix, dungeon.'
  horror: Demons, monsters, blood, skulls and other macabre items.
  religious: Church furnishings, crosses, clergy.
  criminal: Gang, drugs, cash stacks, heist and illegal items.
  retro: Mid-20th-century civilian look (1950s-80s), such as a VCR, gramophone or retro luggage; WWII
    items are wwii.
  cartoon: Toy-like exaggerated look beyond normal low-poly, as in the Kenney kits or kids characters.
condition:
  intact: Undamaged and in normal condition; the default.
  worn: Weathered, scuffed, faded, dirty or stained but whole; use rusty for rust.
  rusty: Visibly rusted metal.
  damaged: Cracked, dented, torn or partly broken but still standing and recognisable; not destroyed.
  destroyed: Wrecked, collapsed, burnt out or in pieces.
  overgrown: Covered by vines, moss or weeds.
  dead: Dead, dried or leafless vegetation.
